<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fund Document — Marketswave</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: {
              DEFAULT: '#1B3A4B',
              dark: '#122A38',
              light: '#2A4F63'
            },
            cream: {
              DEFAULT: '#F7F6F3',
              dark: '#EDE8E1'
            }
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="glass-primitives.css" />
  <link rel="stylesheet" href="tap-targets.css">
  <link rel="stylesheet" href="control-patterns.css">
  <!-- rich-text.css: fund-document.js reuses rich-text.js for rendering only; no editor is
       mounted here, but the shared-stylesheet guard keys on the script, so the sheet is
       linked (1 KB) rather than the guard weakened. -->
  <link rel="stylesheet" href="rich-text.css">
  <link rel="stylesheet" href="fund-document.css">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
  <link rel="stylesheet" href="chat-widget.css" />
  <!-- Chart.js — the project's one charting library (dashboard.html, transactions.html);
       the Valuation history chart is built with it by fund-document.js. -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body class="bg-cream text-slate-800 antialiased">

  <div class="flex h-screen overflow-hidden">

    <!-- ========== SIDEBAR ========== -->
    <div id="sidebar-mount"></div>

    <!-- ========== MAIN CONTENT ========== -->
    <div class="flex-1 flex flex-col overflow-hidden">

      <!-- Top bar -->
      <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between pl-16 pr-8 lg:pl-8">
        <div>
          <p class="text-sm font-medium text-navy" id="live-day">Loading...</p>
          <p class="text-xs text-slate-500" id="live-date-time"></p>
        </div>
        <div class="flex items-center gap-4">
          <div id="notif-bell-mount"></div>
          <a href="index.html" class="text-sm font-medium text-slate-600 hover:text-navy transition">Logout</a>
        </div>
      </header>

      <!-- Page content -->
      <main class="flex-1 overflow-y-auto overflow-x-hidden p-4 sm:p-8 relative">
        <div class="blob blob--sm blob--teal -z-10" style="top:-80px; right:-60px;" aria-hidden="true"></div>

        <div class="max-w-4xl mx-auto">
          <div class="mb-6">
            <a href="asset-collection.html" class="inline-flex items-center gap-1.5 text-sm font-medium text-slate-500 hover:text-navy transition">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
              Back to Asset Collection
            </a>
          </div>

          <!-- Product catalog — fund documents, part 2 (2026-09-12). The whole document is
               rendered by fund-document.js from get-product-document's payload; the hero's
               figures come from the PRODUCT row at request time, never from the document. -->
          <div id="fund-document-root"></div>
        </div>
      </main>
    </div>
  </div>

  <div id="chat-widget-mount"></div>
  <script src="dashboard-sidebar.js"></script>
  <script src="dashboard-common.js"></script>
  <script src="engine-core.js"></script>
  <script src="supabase-data.js"></script>
  <script src="chat-widget.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/motion@13.2.0/dist/motion.js"></script>
  <script src="motion-helpers.js"></script>
  <script src="dashboard-notifications.js"></script>
  <script src="rich-text.js"></script>
  <script src="fund-document.js"></script>
  <script>
    // Reached from asset-collection.html's cards, so it highlights the same sidebar entry
    // that page does (the locked menu has no slot of its own for either).
    initDashboardSidebar('asset-performance');
    initDashboardNotifications();
    initChatWidget();
  </script>

  <script>
    // Product catalog — fund documents, part 2 (2026-09-12): the client-facing render.
    // One real call: get-product-document { productId }. A 404 (nothing published) is a
    // real, expected state and gets its own message, not the generic error card.
    (function () {
      if (typeof MarketswaveData === 'undefined') return;
      var root = document.getElementById('fund-document-root');
      var params = new URLSearchParams(window.location.search);
      var productId = params.get('product') || '';

      function messageCard() {
        return '<div class="glass rounded-2xl p-8 text-center">' +
          '<p class="text-lg font-semibold text-navy mb-1" id="fund-document-message-title"></p>' +
          '<p class="text-sm text-slate-600" id="fund-document-message-body"></p>' +
          '<a href="asset-collection.html" class="mw-btn mw-btn-secondary mt-5">Back to Asset Collection</a>' +
          '</div>';
      }
      function showMessage(title, body) {
        root.innerHTML = messageCard();
        document.getElementById('fund-document-message-title').textContent = title;
        document.getElementById('fund-document-message-body').textContent = body;
      }

      if (!productId) {
        showMessage('No product selected', 'Open a fund document from a product card in the Asset Collection.');
        return;
      }

      MarketswaveData.renderAsyncBundle(root, {
        skeletonHTML: '<div class="rounded-2xl overflow-hidden border border-slate-200 bg-white">' +
          '<div class="p-8 bg-navy">' + MarketswaveData.skeleton.block('w-24', { height: 'h-4' }) + '<div class="mt-3">' + MarketswaveData.skeleton.block('w-2/3', { height: 'h-8' }) + '</div></div>' +
          '<div class="p-8 space-y-4">' + MarketswaveData.skeleton.lines(['w-1/3', 'w-full', 'w-5/6', 'w-2/3']) + '</div></div>',
        load: function () {
          return Promise.all([
            MarketswaveData.callFunction('get-product-document', { productId: productId }),
            MarketswaveData.getSupabaseClient()
          ]).then(function (r) {
            return { payload: r[0], storageBase: r[1] && r[1].supabaseUrl ? String(r[1].supabaseUrl).replace(/\/$/, '') : '' };
          }).catch(function (err) {
            if (err && err.status === 404) return { notPublished: true };
            throw err;
          });
        },
        render: function (data) {
          if (data.notPublished) {
            showMessage('No document published', 'This product does not have a published fund document yet.');
            return;
          }
          MarketswaveFundDocument.render(root, data.payload, { storageBase: data.storageBase });
          document.title = data.payload.product.name + ' — Fund Document — Marketswave';
        }
      });
    })();
  </script>
</body>
</html>
