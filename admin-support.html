<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support — Marketswave PM Tool</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="glass-primitives.css" />
  <link rel="stylesheet" href="tap-targets.css">
  <link rel="stylesheet" href="control-patterns.css">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased">

  <div class="flex h-screen overflow-hidden">

    <div id="admin-sidebar-mount"></div>

    <div class="flex-1 flex flex-col overflow-hidden">

      <div class="bg-red-600 text-white text-xs font-semibold tracking-wide uppercase text-center py-1.5 px-4">
        Internal Tool — Portfolio Manager Access Only — Not the Client-Facing Site
      </div>

      <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between pl-16 pr-8 lg:pl-8">
        <div>
          <p class="text-sm font-medium text-slate-900" id="live-day">Loading...</p>
          <p class="text-xs text-slate-500" id="live-date-time"></p>
        </div>
      </header>

      <main class="flex-1 overflow-y-auto overflow-x-hidden p-8 relative">

        <!-- Admin/PM Tool Visual Treatment (2026-09-06): one restrained atmospheric blob
             in top-right whitespace -- same restraint/technique as the client dashboard
             (relative overflow-x-hidden on <main> substitutes for .blob-field, which
             would break this scrollable container's own vertical scroll). -->
        <div class="blob blob--sm blob--teal -z-10" style="top:-80px; right:-60px;" aria-hidden="true"></div>

        <div class="mb-8">
          <h2 class="text-2xl font-semibold text-slate-900">Support &amp; Disputes</h2>
          <p class="text-slate-500 mt-1">Support requests and disputes across every client.</p>
        </div>

        <!-- Needs Attention -->
        <div class="glass rounded-2xl mb-8">
          <div class="px-6 py-4 border-b border-slate-100">
            <h3 class="font-semibold text-slate-900">Needs Attention <span id="pending-count" class="text-slate-400 font-normal"></span></h3>
          </div>
          <div id="pending-list"></div>
        </div>

        <!-- Resolved -->
        <div class="glass rounded-2xl">
          <div class="px-6 py-4 border-b border-slate-100">
            <h3 class="font-semibold text-slate-900">Resolved</h3>
          </div>
          <div id="history-list"></div>
        </div>

      </main>
    </div>
  </div>

  <!-- Update modal -->
  <div id="update-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/60" id="update-modal-backdrop"></div>
    <div class="relative bg-white rounded-2xl shadow-xl max-w-md w-full p-6">
      <div class="flex items-start justify-between mb-2">
        <p class="text-lg font-semibold text-slate-900">Update Request</p>
        <button type="button" id="update-modal-close" class="text-slate-400 hover:text-slate-900 transition text-xl leading-none">&times;</button>
      </div>
      <p class="text-sm text-slate-500 mb-4" id="update-request-label"></p>
      <div class="mw-fld mw-fld--static mw-fld--admin">
        <select id="update-status-input" class="mw-field mw-field-admin mb-3">
        <option value="Open">Open</option>
        <option value="In Progress">In Progress</option>
        <option value="Resolved">Resolved</option>
      </select>
        <label for="update-status-input">Status</label>
      </div>
      <div class="mw-fld mw-fld--admin">
        <textarea id="update-note-input" rows="4" class="mw-field mw-field-admin mb-2" placeholder="Optional note the client will see on this request..." placeholder=" "></textarea>
        <label for="update-note-input">Response / Note <span class="text-slate-400 font-normal">(visible to the client)</span></label>
      </div>
      <p class="text-xs text-red-500 hidden mb-2" id="update-error"></p>
      <div class="flex gap-3 mt-2">
        <button type="button" id="update-cancel" class="mw-btn mw-btn-secondary mw-btn-grow">Cancel</button>
        <button type="button" id="update-submit" class="mw-btn mw-btn-admin mw-btn-grow">Save Update</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="admin-toast" class="hidden fixed bottom-6 right-6 bg-slate-900 text-white rounded-xl shadow-lg px-5 py-4 max-w-sm z-50">
    <p class="font-medium text-sm" id="admin-toast-title">Done</p>
    <p class="text-sm text-white/80 mt-0.5" id="admin-toast-body"></p>
  </div>

  <script src="admin-sidebar.js"></script>
  <script src="dashboard-common.js"></script>
  <script src="engine-core.js"></script>
  <script src="supabase-data.js"></script>
  <script>
    initAdminSidebar('support');
  </script>

  <script>
    // Bug-fix follow-up to Admin UI Wiring Stage 1 (2026-09-03): wired to the real
    // `support_requests` table + update-support-ticket Edge Function — closing an
    // investigated, confirmed BIDIRECTIONAL local/Supabase split, the same class as
    // admin-documents.html's own fix (see that file's own comment). Needs Attention +
    // Resolved both used to read only engine-core.js's local getAllClientSupportRequests()
    // — meaning a real dispute filed via support.html (wired Stage 5, its own real
    // request-support-ticket Edge Function) was invisible here, and Update used to write
    // only to local localStorage, which the real Supabase-backed support.html could never
    // see. See admin-deposits.html's own comment for the base useAdminClient()/
    // cross-client-RLS reasoning, identical here — `support_requests`' own SELECT policy
    // already grants self-or-admin.
    (function () {
      if (typeof MarketswaveData === 'undefined') return;
      MarketswaveData.useAdminClient();

      var STATUS_STYLES = {
        Open: 'bg-amber-50 text-amber-700',
        'In Progress': 'bg-blue-50 text-blue-700',
        Resolved: 'bg-emerald-50 text-emerald-700'
      };

      var toast = document.getElementById('admin-toast');
      var toastTitle = document.getElementById('admin-toast-title');
      var toastBody = document.getElementById('admin-toast-body');
      var toastTimer;
      function showToast(title, body, isError) {
        toastTitle.textContent = title;
        toastBody.textContent = body;
        toast.classList.toggle('bg-red-700', !!isError);
        toast.classList.toggle('bg-slate-900', !isError);
        toast.classList.remove('hidden');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toast.classList.add('hidden'); }, 4000);
      }

      function fmtDate(iso) {
        return new Date(iso).toLocaleDateString('en-US', { month: 'short', day: '2-digit', year: 'numeric' });
      }

      var supportData = [];

      function renderPending() {
        var requests = supportData
          .filter(function (r) { return r.status !== 'Resolved'; })
          .sort(function (a, b) { return (a.lastUpdated < b.lastUpdated) ? 1 : -1; });
        document.getElementById('pending-count').textContent = requests.length ? '(' + requests.length + ')' : '';
        var listEl = document.getElementById('pending-list');

        if (requests.length === 0) {
          listEl.innerHTML = '<p class="text-sm text-slate-400 px-6 py-8 text-center">Nothing needs attention right now.</p>';
          return;
        }

        listEl.innerHTML = '<div class="divide-y divide-slate-100">' + requests.map(function (r) {
          var statusClass = STATUS_STYLES[r.status] || 'bg-slate-100 text-slate-600';
          return '<div class="px-6 py-5 flex flex-wrap items-start justify-between gap-4">' +
            '<div class="min-w-0">' +
              '<div class="flex items-center gap-2 mb-1.5 flex-wrap">' +
                '<span class="text-xs font-medium px-2.5 py-1 rounded-full bg-slate-100 text-slate-600">' + r.clientName + ' (' + r.clientId + ')</span>' +
                '<span class="text-xs font-medium px-2.5 py-1 rounded-full ' + statusClass + '">' + r.status + '</span>' +
                '<span class="text-xs text-slate-400">' + r.id + (r.reference ? ' · ' + r.reference : '') + ' · Opened ' + fmtDate(r.dateOpened) + '</span>' +
              '</div>' +
              '<p class="text-sm font-medium text-slate-900">' + r.category + '</p>' +
              '<p class="text-sm text-slate-500">' + r.description + '</p>' +
            '</div>' +
            '<div class="shrink-0">' +
              '<button type="button" class="update-btn mw-btn mw-btn-admin" data-client="' + r.clientId + '" data-id="' + r.id + '" data-status="' + r.status + '">Update</button>' +
            '</div>' +
          '</div>';
        }).join('') + '</div>';
      }

      function renderHistory() {
        var requests = supportData
          .filter(function (r) { return r.status === 'Resolved'; })
          .sort(function (a, b) { return (a.lastUpdated < b.lastUpdated) ? 1 : -1; });
        var listEl = document.getElementById('history-list');

        if (requests.length === 0) {
          listEl.innerHTML = '<p class="text-sm text-slate-400 px-6 py-8 text-center">No resolved requests yet.</p>';
          return;
        }

        listEl.innerHTML = '<table class="w-full text-sm"><thead class="bg-slate-50 text-slate-500"><tr>' +
          '<th class="text-left font-medium px-6 py-3">Client</th>' +
          '<th class="text-left font-medium px-6 py-3">Request</th>' +
          '<th class="text-left font-medium px-6 py-3">Category</th>' +
          '<th class="text-left font-medium px-6 py-3">PM Response</th>' +
          '<th class="text-left font-medium px-6 py-3">Resolved</th>' +
          '</tr></thead><tbody class="divide-y divide-slate-100">' +
          requests.map(function (r) {
            return '<tr class="hover:bg-slate-50/50">' +
              '<td class="px-6 py-4 text-slate-500">' + r.clientName + ' (' + r.clientId + ')</td>' +
              '<td class="px-6 py-4 font-medium text-slate-900">' + r.id + '</td>' +
              '<td class="px-6 py-4 text-slate-500">' + r.category + '</td>' +
              '<td class="px-6 py-4 text-slate-500">' + (r.pmNote ? r.pmNote : '—') + '</td>' +
              '<td class="px-6 py-4 text-slate-500">' + fmtDate(r.lastUpdated) + '</td>' +
            '</tr>';
          }).join('') + '</tbody></table>';
      }

      var dataPromise = null;
      function loadPageData() {
        if (dataPromise) return dataPromise;
        dataPromise = Promise.all([
          MarketswaveData.selectTable('support_requests'),
          MarketswaveData.selectTable('clients')
        ]).then(function (results) {
          var clientsById = {};
          results[1].forEach(function (c) { clientsById[c.id] = c.name; });
          return results[0].map(function (r) {
            return {
              id: r.display_id, dbId: r.id, clientId: r.client_id, clientName: clientsById[r.client_id] || r.client_id,
              reference: r.reference, category: r.category, description: r.description, status: r.status,
              dateOpened: r.date_opened, lastUpdated: r.last_updated, evidence: r.evidence, pmNote: r.pm_note
            };
          });
        }).catch(function (err) {
          dataPromise = null;
          throw err;
        });
        return dataPromise;
      }

      function reloadPageData(forceReload) {
        if (forceReload) dataPromise = null;
        MarketswaveData.renderAsyncBundle(document.getElementById('pending-list'), {
          skeletonHTML: '<div class="animate-pulse space-y-3 p-6"><div class="h-12 bg-slate-100 rounded-xl"></div><div class="h-12 bg-slate-100 rounded-xl"></div></div>',
          load: loadPageData,
          render: function (data) { supportData = data; renderPending(); }
        });
        MarketswaveData.renderAsyncBundle(document.getElementById('history-list'), {
          skeletonHTML: '<div class="animate-pulse space-y-3 p-6"><div class="h-8 bg-slate-100 rounded"></div><div class="h-8 bg-slate-100 rounded"></div></div>',
          load: loadPageData,
          render: function (data) { supportData = data; renderHistory(); }
        });
      }

      // ---- Update modal ----
      var updateModal = document.getElementById('update-modal');
      var updateRequestLabel = document.getElementById('update-request-label');
      var updateStatusInput = document.getElementById('update-status-input');
      var updateNoteInput = document.getElementById('update-note-input');
      var updateError = document.getElementById('update-error');
      var activeClientId = null;
      var activeRequestId = null;

      function openUpdateModal(clientId, requestId, currentStatus) {
        activeClientId = clientId;
        activeRequestId = requestId;
        var req = supportData.find(function (r) { return r.clientId === clientId && r.id === requestId; });
        updateRequestLabel.textContent = requestId + ' — ' + (req ? req.category : '');
        updateStatusInput.value = currentStatus;
        updateNoteInput.value = req && req.pmNote ? req.pmNote : '';
        updateError.classList.add('hidden');
        updateModal.classList.remove('hidden');
      }
      function closeUpdateModal() {
        updateModal.classList.add('hidden');
        activeClientId = null;
        activeRequestId = null;
      }

      document.getElementById('update-modal-close').addEventListener('click', closeUpdateModal);
      document.getElementById('update-modal-backdrop').addEventListener('click', closeUpdateModal);
      document.getElementById('update-cancel').addEventListener('click', closeUpdateModal);
      document.getElementById('update-submit').addEventListener('click', function () {
        var clientId = activeClientId;
        var requestId = activeRequestId;
        var status = updateStatusInput.value;
        var pmNote = updateNoteInput.value.trim() || null;
        var btn = document.getElementById('update-submit');
        MarketswaveData.withButtonBusy(btn, 'Saving...', function () {
          return MarketswaveData.callFunction('update-support-ticket', { clientId: clientId, requestId: requestId, status: status, pmNote: pmNote });
        }).then(function (result) {
          closeUpdateModal();
          showToast('Request Updated', result.id + ' is now ' + result.status + '.');
          reloadPageData(true);
        }).catch(function (err) {
          updateError.textContent = MarketswaveData.writeErrorMessage(err);
          updateError.classList.remove('hidden');
        });
      });

      document.getElementById('pending-list').addEventListener('click', function (e) {
        var btn = e.target.closest('.update-btn');
        if (!btn) return;
        openUpdateModal(btn.dataset.client, btn.dataset.id, btn.dataset.status);
      });

      reloadPageData(true);
    })();
  </script>

</body>
</html>
