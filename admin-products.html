<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products — Marketswave PM Tool</title>

  <!-- The Supabase SDK, self-hosted and preloaded here so it downloads beside the stylesheets instead of
       after the page script (row 258). Preload only: nothing evaluates until a page first imports it. -->
  <link rel="modulepreload" href="vendor/supabase-js-2.112.4.min.js" />
  <link rel="modulepreload" href="admin-supabase-config.js" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="glass-primitives.css" />
  <link rel="stylesheet" href="tap-targets.css">
  <link rel="stylesheet" href="control-patterns.css">
  <link rel="stylesheet" href="admin-nav.css">
  <link rel="stylesheet" href="asset-mark.css">
  <link rel="stylesheet" href="admin-products.css">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>

  <!-- Tailwind, compiled once (scripts/build-tailwind.mjs, row 260) — deliberately the LAST stylesheet in <head>:
       the play CDN it replaces appended its generated <style> after every other sheet, so utilities win
       equal-specificity contests; the position preserves that. -->
  <link rel="stylesheet" href="tailwind-3.4.17.css" />
</head>
<body class="bg-slate-100 text-slate-800 antialiased">

  <div class="flex h-screen overflow-hidden">
    <div id="admin-sidebar-mount"></div>

    <div class="flex-1 flex flex-col overflow-hidden">
      <div class="bg-red-600 text-white text-xs font-semibold tracking-wide uppercase text-center py-1.5 px-4">
        Internal Tool — Portfolio Manager Access Only — Not the Client-Facing Site
      </div>

      <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between pl-16 pr-8 lg:pl-8">
        <div>
          <h2 class="text-base font-semibold text-slate-900">Products</h2>
          <p class="text-xs text-slate-600">The catalogue every client allocates from</p>
        </div>
      </header>

      <main class="flex-1 overflow-y-auto relative overflow-x-hidden p-6">
        <div class="pr-wrap mx-auto">

          <div class="pr-top">
            <div>
              <h2>Products</h2>
              <p class="pr-sub" id="pr-sub">Loading…</p>
            </div>
            <div style="display:flex;gap:8px">
              <button type="button" id="pr-add-open" class="mw-btn mw-btn-admin mw-btn-sm">+ Add product</button>
            </div>
          </div>

          <!-- Health strip. Each card is a filter — the catalogue's condition at a glance,
               and one click away from the rows behind each number. -->
          <div class="pr-health" id="pr-health" role="group" aria-label="Catalogue health"></div>

          <div class="pr-bar">
            <div id="pr-pills" style="display:flex;gap:7px;flex-wrap:wrap" role="group" aria-label="Filter products"></div>
            <div class="pr-search">
              <span class="ic" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
              <label for="pr-search" class="sr-only">Search products by name or ticker</label>
              <input type="search" id="pr-search" placeholder="Search name or ticker" autocomplete="off" />
            </div>
          </div>

          <section class="pr-table" id="pr-table" aria-label="Product catalogue"></section>

          <!-- Elbstream's attribution: required, at least 12pt, on every page showing one of
               its logos (asset-mark.css / asset-mark.js). -->
          <p class="asset-logo-credit">Logos provided by <a href="https://elbstream.com" target="_blank" rel="noopener">Elbstream</a></p>
        </div>
      </main>
    </div>
  </div>

  <!-- One overlay hosts BOTH panels — the detail panel (shaped by pricing model) and the
       create panel. The mockup shows the two shapes side by side to compare them; a PM only
       ever has one open. -->
  <div id="pr-scrim" class="pr-scrim hidden" role="dialog" aria-modal="true" aria-labelledby="pr-panel-title">
    <div class="pr-panel" id="pr-panel"></div>
  </div>

  <div id="pr-toast" class="fixed bottom-6 right-6 z-[70] hidden max-w-sm rounded-lg bg-slate-900 px-4 py-3 text-sm text-white shadow-lg" role="status" aria-live="polite"></div>

  <script src="format-helpers.js"></script>
  <script src="asset-mark.js"></script>
  <script src="supabase-data.js"></script>
  <script src="admin-sidebar.js"></script>
  <script src="dashboard-common.js"></script>
  <!-- ★ MOUNT THE SHARED ADMIN NAV. The approval gate shipped without this exact line and
       rendered reachable then inescapable — no rail, no active item, no Log out — and neither
       a real browser render nor a 69-assertion suite caught it, because everything looked at
       the feature and nothing at the chrome (register row 228). Only admin-login.html may
       omit it. This page's own suites assert the nav mounts, for that reason. -->
  <script>
    initAdminSidebar('products');
  </script>
  <script src="admin-products-page.js"></script>
</body>
</html>
