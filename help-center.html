<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Help Center — Marketswave</title>
  <meta name="description" content="The Marketswave Help Center has moved to /help." />

  <!-- The Help Center used to be a "coming soon" stub at this address (row 103). The real one now
       lives at /help, which serves both the landing and every article (?a=<slug>). This page is
       kept as a REDIRECT rather than deleted: it has been live on marketswave.net, so it may be
       bookmarked or indexed, and a 404 would strand anyone holding the old link. Leaving the old
       stub in place was the one option ruled out — it told visitors the Help Center was still
       "coming soon" while the real one was live. The canonical tag points search engines at the
       real page; the script moves a real visitor; the link below is what a visitor or a crawler
       with no JavaScript gets. -->
  <link rel="canonical" href="https://marketswave.net/help" />
  <meta name="robots" content="noindex, follow" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <section class="section">
    <div class="container">
      <div class="text-center" style="max-width:560px; margin:0 auto; padding:60px 0;">
        <h1 style="margin-bottom:14px;">The Help Center has moved</h1>
        <p style="color:var(--text-muted); margin-bottom:26px;">It now lives at
          <strong>marketswave.net/help</strong>, with search and every article.</p>
        <a href="help.html" class="btn btn-primary">Go to the Help Center</a>
      </div>
    </div>
  </section>
  <script>location.replace('help.html' + location.search);</script>
</body>
</html>
