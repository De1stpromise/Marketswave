<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sells — Marketswave PM Tool</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="glass-primitives.css" />
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased">

  <div class="flex h-screen overflow-hidden">

    <div id="admin-sidebar-mount"></div>

    <div class="flex-1 flex flex-col overflow-hidden">

      <div class="bg-red-600 text-white text-xs font-semibold tracking-wide uppercase text-center py-1.5 px-4">
        Internal Tool — Portfolio Manager Access Only — Not the Client-Facing Site
      </div>

      <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between pl-16 pr-8 lg:pl-8">
        <div>
          <p class="text-sm font-medium text-slate-900" id="live-day">Loading...</p>
          <p class="text-xs text-slate-500" id="live-date-time"></p>
        </div>
      </header>

      <main class="flex-1 overflow-y-auto overflow-x-hidden p-8 relative">

        <!-- Admin/PM Tool Visual Treatment (2026-09-06): one restrained atmospheric blob
             in top-right whitespace -- same restraint/technique as the client dashboard
             (relative overflow-x-hidden on <main> substitutes for .blob-field, which
             would break this scrollable container's own vertical scroll). -->
        <div class="blob blob--sm blob--gold -z-10" style="top:-80px; right:-60px;" aria-hidden="true"></div>

        <div class="mb-8">
          <h2 class="text-2xl font-semibold text-slate-900">Sells</h2>
          <p class="text-slate-500 mt-1">Client-submitted sell requests, awaiting approval.</p>
        </div>

        <!-- Pending -->
        <div class="glass rounded-2xl mb-8">
          <div class="px-6 py-4 border-b border-slate-100">
            <h3 class="font-semibold text-slate-900">Pending <span id="pending-count" class="text-slate-400 font-normal"></span></h3>
          </div>
          <div id="pending-list"></div>
        </div>

        <!-- History -->
        <div class="glass rounded-2xl">
          <div class="px-6 py-4 border-b border-slate-100">
            <h3 class="font-semibold text-slate-900">History</h3>
          </div>
          <div id="history-list"></div>
        </div>

      </main>
    </div>
  </div>

  <!-- Approve modal -->
  <div id="approve-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/60" id="approve-modal-backdrop"></div>
    <div class="relative bg-white rounded-2xl shadow-xl max-w-sm w-full p-6">
      <div class="flex items-start justify-between mb-2">
        <p class="text-lg font-semibold text-slate-900">Approve Sell</p>
        <button type="button" id="approve-modal-close" class="text-slate-400 hover:text-slate-900 transition text-xl leading-none">&times;</button>
      </div>
      <p class="text-sm text-slate-500 mb-4">Execute <span class="font-medium text-slate-900" id="approve-summary-label"></span>? Units and price are re-validated against the current holding at approval time.</p>
      <p class="text-xs text-red-500 hidden mb-2" id="approve-error"></p>
      <div class="flex gap-3">
        <button type="button" id="approve-cancel" class="flex-1 py-2.5 rounded-lg border border-slate-200 text-sm font-medium text-slate-600 hover:bg-slate-50 transition">Cancel</button>
        <button type="button" id="approve-submit" class="flex-1 py-2.5 rounded-lg bg-emerald-600 text-white text-sm font-medium hover:bg-emerald-700 transition">Approve</button>
      </div>
    </div>
  </div>

  <!-- Reject modal -->
  <div id="reject-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/60" id="reject-modal-backdrop"></div>
    <div class="relative bg-white rounded-2xl shadow-xl max-w-sm w-full p-6">
      <div class="flex items-start justify-between mb-2">
        <p class="text-lg font-semibold text-slate-900">Reject Sell</p>
        <button type="button" id="reject-modal-close" class="text-slate-400 hover:text-slate-900 transition text-xl leading-none">&times;</button>
      </div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Reason (optional)</label>
      <textarea id="reject-reason-input" rows="3" class="w-full px-4 py-2.5 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/30 focus:border-amber-500 mb-2" placeholder="Why is this request being rejected?"></textarea>
      <p class="text-xs text-red-500 hidden mb-2" id="reject-error"></p>
      <div class="flex gap-3 mt-2">
        <button type="button" id="reject-cancel" class="flex-1 py-2.5 rounded-lg border border-slate-200 text-sm font-medium text-slate-600 hover:bg-slate-50 transition">Cancel</button>
        <button type="button" id="reject-submit" class="flex-1 py-2.5 rounded-lg bg-red-600 text-white text-sm font-medium hover:bg-red-700 transition">Reject Request</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="admin-toast" class="hidden fixed bottom-6 right-6 bg-slate-900 text-white rounded-xl shadow-lg px-5 py-4 max-w-sm z-50">
    <p class="font-medium text-sm" id="admin-toast-title">Done</p>
    <p class="text-sm text-white/80 mt-0.5" id="admin-toast-body"></p>
  </div>

  <script src="admin-sidebar.js"></script>
  <script src="dashboard-common.js"></script>
  <script src="engine-core.js"></script>
  <script src="supabase-data.js"></script>
  <script>
    initAdminSidebar('sells');
  </script>

  <script>
    // Admin UI Wiring — Stage 1 (2026-09-03): wired to the real sell_requests table +
    // approve-sell/reject-sell Edge Functions (local stack). See admin-deposits.html's own
    // comment for the full useAdminClient()/cross-client-RLS reasoning, identical here.
    // productName()/estimateValue() now read from a real fetched `products` array; the
    // History table's Realized Return column now reads a real per-client `transactions` row
    // via a direct RLS-authorized read (transactions' own SELECT policy already grants
    // self-or-admin, confirmed by reading Phase B Stage 1's migration directly), replacing
    // getTransactionForClient(clientId, txnId).
    (function () {
      if (typeof MarketswaveData === 'undefined') return;
      MarketswaveData.useAdminClient();

      var STATUS_STYLES = {
        pending: 'bg-amber-50 text-amber-700',
        approved: 'bg-emerald-50 text-emerald-700',
        rejected: 'bg-red-50 text-red-700'
      };

      var toast = document.getElementById('admin-toast');
      var toastTitle = document.getElementById('admin-toast-title');
      var toastBody = document.getElementById('admin-toast-body');
      var toastTimer;
      function showToast(title, body, isError) {
        toastTitle.textContent = title;
        toastBody.textContent = body;
        toast.classList.toggle('bg-red-700', !!isError);
        toast.classList.toggle('bg-slate-900', !isError);
        toast.classList.remove('hidden');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toast.classList.add('hidden'); }, 4000);
      }

      function formatUSD(n) {
        return '$' + Math.round(n).toLocaleString();
      }

      function toDateOnly(iso) { return typeof iso === 'string' ? iso.slice(0, 10) : iso; }

      var sellRequests = [];
      var productsById = {}; // id -> { name, unitPrice }
      function productName(id) {
        return productsById[id] ? productsById[id].name : id;
      }

      // Context estimate only — current unit price x requested units, computed fresh on each
      // render. Not the figure that will necessarily execute: approve-sell re-settles the
      // product and re-validates unit availability at approval time (Phase 3B), so the actual
      // executed price/units can differ if time has passed or the holding has shrunk.
      function estimateValue(productId, units) {
        var p = productsById[productId];
        if (!p) return null;
        return units * p.unitPrice;
      }

      function renderPending() {
        var requests = sellRequests.filter(function (r) { return r.status === 'pending'; })
          .sort(function (a, b) { return new Date(b.requestedAt) - new Date(a.requestedAt); });
        document.getElementById('pending-count').textContent = requests.length ? '(' + requests.length + ')' : '';
        var listEl = document.getElementById('pending-list');

        if (requests.length === 0) {
          listEl.innerHTML = '<p class="text-sm text-slate-400 px-6 py-8 text-center">No pending sell requests.</p>';
          return;
        }

        listEl.innerHTML = '<div class="divide-y divide-slate-100">' + requests.map(function (r) {
          var est = estimateValue(r.productId, r.unitsToSell);
          var estLabel = est === null ? '—' : formatUSD(est) + ' (est., at current price)';
          return '<div class="px-6 py-5 flex flex-wrap items-center justify-between gap-4">' +
            '<div class="min-w-0">' +
              '<div class="flex items-center gap-2 mb-1.5 flex-wrap">' +
                '<span class="text-xs font-medium px-2.5 py-1 rounded-full bg-slate-100 text-slate-600">' + r.clientName + ' (' + r.clientId + ')</span>' +
                '<span class="text-xs text-slate-400">' + r.id + ' · Requested ' + toDateOnly(r.requestedAt) + '</span>' +
              '</div>' +
              '<p class="text-lg font-semibold text-slate-900">' + productName(r.productId) + '</p>' +
              '<p class="text-sm text-slate-500 mt-0.5">' + r.unitsToSell.toFixed(4) + ' units · ' + estLabel + '</p>' +
            '</div>' +
            '<div class="flex gap-2 shrink-0">' +
              '<button type="button" class="reject-btn px-4 py-2 rounded-lg border border-slate-200 text-sm font-medium text-slate-600 hover:bg-slate-50 transition" data-client="' + r.clientId + '" data-id="' + r.id + '">Reject</button>' +
              '<button type="button" class="approve-btn px-4 py-2 rounded-lg bg-emerald-600 text-white text-sm font-medium hover:bg-emerald-700 transition" data-client="' + r.clientId + '" data-id="' + r.id + '" data-summary="' + r.unitsToSell.toFixed(4) + ' units of ' + productName(r.productId) + '">Approve</button>' +
            '</div>' +
          '</div>';
        }).join('') + '</div>';
      }

      function renderHistory() {
        var requests = sellRequests.filter(function (r) { return r.status !== 'pending'; })
          .sort(function (a, b) { return new Date(b.requestedAt) - new Date(a.requestedAt); });
        var listEl = document.getElementById('history-list');

        if (requests.length === 0) {
          listEl.innerHTML = '<p class="text-sm text-slate-400 px-6 py-8 text-center">No resolved requests yet.</p>';
          return;
        }

        listEl.innerHTML = '<table class="w-full text-sm"><thead class="bg-slate-50 text-slate-500"><tr>' +
          '<th class="text-left font-medium px-6 py-3">Client</th>' +
          '<th class="text-left font-medium px-6 py-3">Request</th>' +
          '<th class="text-left font-medium px-6 py-3">Product</th>' +
          '<th class="text-right font-medium px-6 py-3">Units</th>' +
          '<th class="text-right font-medium px-6 py-3">Realized Return</th>' +
          '<th class="text-left font-medium px-6 py-3">Status</th>' +
          '<th class="text-left font-medium px-6 py-3">Resolved</th>' +
          '</tr></thead><tbody class="divide-y divide-slate-100">' +
          requests.map(function (r) {
            var statusClass = STATUS_STYLES[r.status] || 'bg-slate-100 text-slate-600';
            var statusLabel = r.status.charAt(0).toUpperCase() + r.status.slice(1);
            var resolvedText = (r.resolvedAt ? toDateOnly(r.resolvedAt) : '—') + (r.status === 'rejected' && r.reason ? ' — ' + r.reason : '');
            // Realized Return is now read directly off a real, RLS-authorized `transactions`
            // row (transactions.SELECT already grants self-or-admin — confirmed by reading
            // Phase B Stage 1's migration directly), fetched cross-client alongside this
            // row's own request data in loadPageData() and joined in by transaction_id —
            // replacing the old per-client-scoped-localStorage getTransactionForClient() call.
            var returnCell = r.realizedReturn !== null && r.realizedReturn !== undefined
              ? '<span class="' + (r.realizedReturn >= 0 ? 'text-emerald-600' : 'text-red-600') + '">' + (r.realizedReturn >= 0 ? '+' : '') + formatUSD(r.realizedReturn) + '</span>'
              : '—';
            return '<tr class="hover:bg-slate-50/50">' +
              '<td class="px-6 py-4 text-slate-500">' + r.clientName + ' (' + r.clientId + ')</td>' +
              '<td class="px-6 py-4 font-medium text-slate-900">' + r.id + '</td>' +
              '<td class="px-6 py-4 text-slate-500">' + productName(r.productId) + '</td>' +
              '<td class="px-6 py-4 text-right text-slate-900">' + r.unitsToSell.toFixed(4) + '</td>' +
              '<td class="px-6 py-4 text-right">' + returnCell + '</td>' +
              '<td class="px-6 py-4"><span class="text-xs font-medium px-2.5 py-1 rounded-full ' + statusClass + '">' + statusLabel + '</span></td>' +
              '<td class="px-6 py-4 text-slate-500">' + resolvedText + '</td>' +
            '</tr>';
          }).join('') + '</tbody></table>';
      }

      var dataPromise = null;
      function loadPageData() {
        if (dataPromise) return dataPromise;
        dataPromise = Promise.all([
          MarketswaveData.selectTable('sell_requests'),
          MarketswaveData.selectTable('clients'),
          MarketswaveData.selectTable('products'),
          MarketswaveData.selectTable('transactions')
        ]).then(function (results) {
          var clientsById = {};
          results[1].forEach(function (c) { clientsById[c.id] = c.name; });
          productsById = {};
          results[2].forEach(function (p) { productsById[p.id] = { name: p.name, unitPrice: p.unit_price }; });
          var transactionsById = {};
          results[3].forEach(function (t) { transactionsById[t.id] = t; });
          return results[0].map(function (r) {
            var txn = r.transaction_id ? transactionsById[r.transaction_id] : null;
            return {
              id: r.id, clientId: r.client_id, clientName: clientsById[r.client_id] || r.client_id,
              productId: r.product_id, unitsToSell: r.units_to_sell, status: r.status,
              requestedAt: r.requested_at, resolvedAt: r.resolved_at,
              transactionId: r.transaction_id, reason: r.reason,
              realizedReturn: txn ? txn.realized_return : null
            };
          });
        }).catch(function (err) {
          dataPromise = null;
          throw err;
        });
        return dataPromise;
      }

      function reloadPageData(forceReload) {
        if (forceReload) dataPromise = null;
        MarketswaveData.renderAsyncBundle(document.getElementById('pending-list'), {
          skeletonHTML: '<div class="animate-pulse space-y-3 p-6"><div class="h-12 bg-slate-100 rounded-xl"></div><div class="h-12 bg-slate-100 rounded-xl"></div></div>',
          load: loadPageData,
          render: function (data) { sellRequests = data; renderPending(); }
        });
        MarketswaveData.renderAsyncBundle(document.getElementById('history-list'), {
          skeletonHTML: '<div class="animate-pulse space-y-3 p-6"><div class="h-8 bg-slate-100 rounded"></div><div class="h-8 bg-slate-100 rounded"></div></div>',
          load: loadPageData,
          render: function (data) { sellRequests = data; renderHistory(); }
        });
      }

      // ---- Approve modal ----
      var approveModal = document.getElementById('approve-modal');
      var approveError = document.getElementById('approve-error');
      var approveSummaryLabel = document.getElementById('approve-summary-label');
      var activeApproveClientId = null;
      var activeApproveId = null;

      function openApproveModal(clientId, id, summary) {
        activeApproveClientId = clientId;
        activeApproveId = id;
        approveSummaryLabel.textContent = summary;
        approveError.classList.add('hidden');
        approveModal.classList.remove('hidden');
      }
      function closeApproveModal() { approveModal.classList.add('hidden'); activeApproveClientId = null; activeApproveId = null; }

      document.getElementById('approve-modal-close').addEventListener('click', closeApproveModal);
      document.getElementById('approve-modal-backdrop').addEventListener('click', closeApproveModal);
      document.getElementById('approve-cancel').addEventListener('click', closeApproveModal);
      document.getElementById('approve-submit').addEventListener('click', function () {
        var requestId = activeApproveId;
        var btn = document.getElementById('approve-submit');
        // approve-sell re-validates unit availability against the CURRENT holding
        // server-side (Phase 3B's own re-validation-at-approval-time discipline, ported) and
        // rejects with a real 409 rather than executing a partial/incorrect sell — surfaced
        // verbatim here via writeErrorMessage() rather than assumed to always succeed.
        MarketswaveData.withButtonBusy(btn, 'Approving...', function () {
          return MarketswaveData.callFunction('approve-sell', { requestId: requestId });
        }).then(function (result) {
          closeApproveModal();
          showToast('Sell Approved', result.id + ' executed as transaction ' + result.transactionId + '.');
          reloadPageData(true);
        }).catch(function (err) {
          approveError.textContent = MarketswaveData.writeErrorMessage(err);
          approveError.classList.remove('hidden');
        });
      });

      // ---- Reject modal ----
      var rejectModal = document.getElementById('reject-modal');
      var rejectReasonInput = document.getElementById('reject-reason-input');
      var rejectError = document.getElementById('reject-error');
      var activeRejectClientId = null;
      var activeRejectId = null;

      function openRejectModal(clientId, id) {
        activeRejectClientId = clientId;
        activeRejectId = id;
        rejectReasonInput.value = '';
        rejectError.classList.add('hidden');
        rejectModal.classList.remove('hidden');
      }
      function closeRejectModal() { rejectModal.classList.add('hidden'); activeRejectClientId = null; activeRejectId = null; }

      document.getElementById('reject-modal-close').addEventListener('click', closeRejectModal);
      document.getElementById('reject-modal-backdrop').addEventListener('click', closeRejectModal);
      document.getElementById('reject-cancel').addEventListener('click', closeRejectModal);
      document.getElementById('reject-submit').addEventListener('click', function () {
        var requestId = activeRejectId;
        var reason = rejectReasonInput.value.trim();
        var btn = document.getElementById('reject-submit');
        MarketswaveData.withButtonBusy(btn, 'Rejecting...', function () {
          return MarketswaveData.callFunction('reject-sell', { requestId: requestId, reason: reason });
        }).then(function (result) {
          closeRejectModal();
          showToast('Sell Rejected', result.id + ' has been rejected.', true);
          reloadPageData(true);
        }).catch(function (err) {
          rejectError.textContent = MarketswaveData.writeErrorMessage(err);
          rejectError.classList.remove('hidden');
        });
      });

      // ---- Delegated click handlers for row buttons ----
      document.getElementById('pending-list').addEventListener('click', function (e) {
        var approveBtn = e.target.closest('.approve-btn');
        if (approveBtn) {
          openApproveModal(approveBtn.dataset.client, approveBtn.dataset.id, approveBtn.dataset.summary);
          return;
        }
        var rejectBtn = e.target.closest('.reject-btn');
        if (rejectBtn) openRejectModal(rejectBtn.dataset.client, rejectBtn.dataset.id);
      });

      reloadPageData(true);
    })();
  </script>

</body>
</html>
