<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asset Collection — Marketswave</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: {
              DEFAULT: '#1B3A4B',
              dark: '#122A38',
              light: '#2A4F63'
            },
            cream: {
              DEFAULT: '#F7F6F3',
              dark: '#EDE8E1'
            }
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-cream text-slate-800 antialiased">

  <div class="flex h-screen overflow-hidden">

    <!-- ========== SIDEBAR ========== -->
    <div id="sidebar-mount"></div>

    <!-- ========== MAIN CONTENT ========== -->
    <div class="flex-1 flex flex-col overflow-hidden">

      <!-- Top bar -->
      <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between pl-16 pr-8 lg:pl-8">
        <div>
          <p class="text-sm font-medium text-navy" id="live-day">Loading...</p>
          <p class="text-xs text-slate-500" id="live-date-time"></p>
        </div>
        <div class="flex items-center gap-4">
          <div id="notif-bell-mount"></div>
          <a href="index.html" class="text-sm font-medium text-slate-600 hover:text-navy transition">Logout</a>
        </div>
      </header>

      <!-- Page content -->
      <main class="flex-1 overflow-y-auto p-8">

        <div class="mb-8">
          <a href="asset-performance.html" class="inline-flex items-center gap-1.5 text-sm font-medium text-slate-500 hover:text-navy transition mb-3">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
            Back to Asset & Performance
          </a>
          <h2 class="text-2xl font-semibold text-navy">Asset Collection</h2>
          <p class="text-slate-500 mt-1">Browse available assets. Requests are sent for Portfolio Manager approval.</p>
        </div>

        <div class="bg-white rounded-2xl border border-slate-200 p-6">

          <!-- Search -->
          <div class="relative max-w-sm mb-5">
            <svg class="w-4 h-4 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.35-4.35M17 10a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            <input type="text" id="asset-search" placeholder="Search by asset name..." class="w-full pl-9 pr-3 py-2.5 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-navy/20 focus:border-navy">
          </div>

          <!-- Category tabs -->
          <div class="flex flex-wrap gap-2 mb-6" id="category-tabs">
            <button type="button" class="category-tab px-4 py-2 rounded-lg text-sm font-medium bg-navy text-white" data-category="">All</button>
            <button type="button" class="category-tab px-4 py-2 rounded-lg text-sm font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition" data-category="Private Equity">Private Equity</button>
            <button type="button" class="category-tab px-4 py-2 rounded-lg text-sm font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition" data-category="Real Assets">Real Assets</button>
            <button type="button" class="category-tab px-4 py-2 rounded-lg text-sm font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition" data-category="Stocks & ETFs">Stocks & ETFs</button>
            <button type="button" class="category-tab px-4 py-2 rounded-lg text-sm font-medium bg-slate-100 text-slate-600 hover:bg-slate-200 transition" data-category="Crypto">Crypto</button>
          </div>

          <!-- Asset cards grid -->
          <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4" id="asset-cards-grid"></div>

          <p class="hidden text-sm text-slate-400 text-center py-8" id="no-results">No assets match your search/filter.</p>

          <div class="text-center mt-6">
            <button type="button" id="load-more-btn" class="hidden px-6 py-2.5 rounded-lg border border-slate-200 text-sm font-medium text-navy hover:bg-slate-50 transition">Load More</button>
          </div>

        </div>

        <!-- Allocation Request Confirmation Toast -->
        <div id="allocation-toast" class="hidden fixed bottom-6 right-6 bg-navy text-white rounded-xl shadow-lg px-5 py-4 max-w-sm z-50">
          <p class="font-medium text-sm" id="allocation-toast-title">Request Sent</p>
          <p class="text-xs text-white/70 mt-1" id="allocation-toast-body"></p>
        </div>

        <!-- "More info" popup (Private Equity/Real Assets cards) — one shared modal,
             populated per click; works identically regardless of which category tab is
             active, since it's driven by the clicked card's own product id, not the tab. -->
        <div id="more-info-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
          <div class="absolute inset-0 bg-black/50" id="more-info-modal-backdrop"></div>
          <div class="relative bg-white rounded-2xl shadow-xl max-w-md w-full p-6">
            <div class="flex items-start justify-between mb-3">
              <p class="text-lg font-semibold text-navy" id="more-info-modal-title"></p>
              <button type="button" id="more-info-modal-close" class="text-slate-400 hover:text-slate-900 transition text-xl leading-none">&times;</button>
            </div>
            <p class="text-sm text-slate-600 whitespace-pre-line" id="more-info-modal-body"></p>
          </div>
        </div>

      </main>
    </div>
  </div>

  <script src="dashboard-sidebar.js"></script>
  <script src="dashboard-common.js"></script>
  <script src="engine-core.js"></script>
  <script src="dashboard-notifications.js"></script>
  <script>
    // No dedicated nav item for this page (the locked sidebar menu order is fixed — see
    // CLAUDE.md — and this page wasn't asked to join it). Highlights 'asset-performance'
    // instead, the same "still within this section" treatment, since this page's entire
    // content used to live physically on asset-performance.html and is reached via a link
    // from there, not a standalone destination in its own right.
    initDashboardSidebar('asset-performance');
    initDashboardNotifications();
  </script>

  <script>
    // Extracted from asset-performance.html (Aug 21, 2026) — same requestAllocation() calls,
    // same "Pending PM approval" flow, unchanged behavior. New here: search (by name) and a
    // genuinely load-bearing category filter (previously cosmetic on a 4-product catalog),
    // plus a "Load More" control instead of an unbounded grid — chosen over numbered
    // pagination as the simpler option given the existing card markup is a single
    // .map().join() render into one container; Load More just re-renders a larger slice of
    // the same already-filtered array, no page-index bookkeeping needed.
    (function () {
      if (typeof settleAllProducts !== 'function') return; // engine-core.js failed to load — bail defensively

      settleAllProducts(); // catch prices up to today before reading any engine value

      var UNALLOCATABLE_CLASS = 'Unallocated / Cash';
      var PAGE_SIZE = 9;

      function formatUSD(n, decimals) {
        var sign = n < 0 ? '-' : '';
        var abs = Math.abs(n);
        return sign + '$' + abs.toLocaleString('en-US', {
          minimumFractionDigits: decimals || 0,
          maximumFractionDigits: decimals || 0
        });
      }

      var holdings = getHoldings();
      var allocatableProducts = getAllProducts().filter(function (p) { return p.assetClass !== UNALLOCATABLE_CLASS; });

      function holdingByProductId(id) { return holdings.find(function (h) { return h.productId === id; }); }
      function productById(id) { return allocatableProducts.find(function (p) { return p.id === id; }); }

      // ---- Search + filter — pure functions, same shape as admin-clients.html's own
      // matchesSearch()/matchesTypeFilter()/applyFilters() precedent. ----
      function matchesSearch(product, query) {
        if (!query) return true;
        return product.name.toLowerCase().indexOf(query.trim().toLowerCase()) !== -1;
      }
      function matchesCategory(product, category) {
        if (!category) return true;
        return product.assetClass === category;
      }
      function applyFilters(productsArr, query, category) {
        return productsArr.filter(function (p) { return matchesSearch(p, query) && matchesCategory(p, category); });
      }

      var searchQuery = '';
      var categoryFilter = '';
      var visibleCount = PAGE_SIZE;

      // Logo box (Stocks & ETFs/Crypto only) — real image if logoUrl is set, otherwise
      // initials derived from the product name via the same getClientInitials() logic
      // client identity avatars already use elsewhere. Both nodes are always rendered when a
      // logo is present; the fallback stays hidden until the image actually fails to load
      // (wired via a real 'error' listener after render, not an inline handler — this
      // project doesn't use inline event attributes anywhere else), so a bad/broken logoUrl
      // degrades to initials instead of a broken-image icon.
      function logoBoxHTML(product) {
        var initials = (typeof getClientInitials === 'function') ? getClientInitials(product.name) : '';
        var hasLogo = !!product.logoUrl;
        return '<div class="w-7 h-7 rounded-md bg-slate-100 flex-shrink-0 overflow-hidden flex items-center justify-center">' +
          (hasLogo ? '<img src="' + product.logoUrl + '" alt="" class="product-logo-img w-full h-full object-cover" data-product-id="' + product.id + '">' : '') +
          '<span class="product-logo-fallback text-slate-500 text-[10px] font-semibold' + (hasLogo ? ' hidden' : '') + '">' + initials + '</span>' +
          '</div>';
      }

      function cardHTML(product) {
        var holding = holdingByProductId(product.id);
        var badgeHtml;
        if (holding) {
          var pct = getUnrealizedReturnPercent(product.id);
          var pctColor = pct > 0 ? 'bg-emerald-50 text-emerald-700' : (pct < 0 ? 'bg-red-50 text-red-700' : 'bg-slate-100 text-slate-600');
          badgeHtml = '<span class="text-xs font-medium px-2 py-1 rounded-full ' + pctColor + '">' + (pct > 0 ? '+' : '') + pct.toFixed(1) + '%</span>';
        } else {
          badgeHtml = '<span class="text-xs font-medium px-2 py-1 rounded-full bg-slate-100 text-slate-500">No position</span>';
        }
        var allocatedLine = holding ? 'Allocated: ' + formatUSD(Math.round(holding.costBasis)) : 'Not yet allocated';

        // Logo box (Stocks & ETFs/Crypto) and "More info" popup link (Private Equity/Real
        // Assets) are mutually exclusive by category, both minimal by design — neither
        // competes with Request Allocation for visual weight. Both degrade cleanly when the
        // underlying field is unset: no logo box renders for a product missing logoUrl
        // outside its category (not applicable), and no "More info" link renders at all when
        // extendedDescription is empty, rather than opening on nothing.
        var showLogo = product.assetClass === 'Stocks & ETFs' || product.assetClass === 'Crypto';
        var showMoreInfo = (product.assetClass === 'Private Equity' || product.assetClass === 'Real Assets') && product.extendedDescription;

        // flex flex-col + mt-auto on the CTA block — unchanged from the original card,
        // anchors the input/button to the bottom of the card regardless of how many lines
        // the content above it takes (description length now varies this further).
        return '<div class="border border-slate-200 rounded-xl p-5 hover:border-navy/30 transition flex flex-col" data-product-id="' + product.id + '">' +
          '<div class="flex items-start justify-between mb-3">' +
          '<div class="flex items-start gap-2.5">' +
          (showLogo ? logoBoxHTML(product) : '') +
          '<div><p class="font-medium text-navy">' + product.name + '</p>' +
          '<p class="text-xs text-slate-500 mt-0.5">' + product.assetClass + '</p></div>' +
          '</div>' +
          badgeHtml +
          '</div>' +
          (product.description ? '<p class="text-sm text-slate-600 mb-1">' + product.description + '</p>' : '') +
          (showMoreInfo ? '<button type="button" class="more-info-link text-xs font-medium text-navy underline hover:no-underline mb-2" data-product-id="' + product.id + '">More info</button>' : '') +
          '<p class="text-sm text-slate-600 mb-1">' + allocatedLine + '</p>' +
          '<p class="text-xs text-slate-400 mb-4">Minimum investment: ' + formatUSD(product.minimumInvestment) + '</p>' +
          '<div class="mt-auto">' +
          '<label class="block text-xs font-medium text-slate-500 mb-1.5">Requested Allocation Amount</label>' +
          '<input type="number" min="0" step="100" placeholder="$0.00" class="allocation-amount-input w-full px-3 py-2 mb-3 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-navy/20 focus:border-navy">' +
          '<button type="button" class="request-allocation-btn w-full py-2 rounded-lg text-sm font-medium border border-navy text-navy hover:bg-navy hover:text-white transition">Request Allocation</button>' +
          '</div>' +
          '</div>';
      }

      var cardsGrid = document.getElementById('asset-cards-grid');
      var noResultsEl = document.getElementById('no-results');
      var loadMoreBtn = document.getElementById('load-more-btn');

      function render() {
        var filtered = applyFilters(allocatableProducts, searchQuery, categoryFilter);
        var visible = filtered.slice(0, visibleCount);

        if (filtered.length === 0) {
          cardsGrid.innerHTML = '';
          noResultsEl.classList.remove('hidden');
          loadMoreBtn.classList.add('hidden');
          return;
        }
        noResultsEl.classList.add('hidden');
        cardsGrid.innerHTML = visible.map(cardHTML).join('');
        loadMoreBtn.classList.toggle('hidden', visibleCount >= filtered.length);

        // Real 'error' listener per rendered logo image (not an inline onerror attribute —
        // this project doesn't use inline event handlers anywhere else) — falls back to the
        // adjacent initials span rather than showing a broken-image icon.
        cardsGrid.querySelectorAll('.product-logo-img').forEach(function (img) {
          img.addEventListener('error', function () {
            img.classList.add('hidden');
            var fallback = img.nextElementSibling;
            if (fallback) fallback.classList.remove('hidden');
          });
        });
      }
      render();

      // ---- Search ----
      document.getElementById('asset-search').addEventListener('input', function (e) {
        searchQuery = e.target.value;
        visibleCount = PAGE_SIZE; // a new search always starts from the first page again
        render();
      });

      // ---- Category tab filtering ----
      var tabs = document.querySelectorAll('.category-tab');
      tabs.forEach(function (tab) {
        tab.addEventListener('click', function () {
          tabs.forEach(function (t) {
            t.classList.remove('bg-navy', 'text-white');
            t.classList.add('bg-slate-100', 'text-slate-600');
          });
          tab.classList.remove('bg-slate-100', 'text-slate-600');
          tab.classList.add('bg-navy', 'text-white');

          categoryFilter = tab.dataset.category;
          visibleCount = PAGE_SIZE; // a new filter always starts from the first page again
          render();
        });
      });

      // ---- Load More ----
      loadMoreBtn.addEventListener('click', function () {
        visibleCount += PAGE_SIZE;
        render();
      });

      // ---- Request Allocation: identical engine wiring to the original card ----
      var toast = document.getElementById('allocation-toast');
      var toastTitle = document.getElementById('allocation-toast-title');
      var toastBody = document.getElementById('allocation-toast-body');
      var toastTimer;

      function showToast(title, body, isError) {
        toastTitle.textContent = title;
        toastBody.textContent = body;
        toast.classList.toggle('bg-red-700', !!isError);
        toast.classList.toggle('bg-navy', !isError);
        toast.classList.remove('hidden');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toast.classList.add('hidden'); }, 4000);
      }

      // ---- "More info" popup (Private Equity/Real Assets) ----
      var moreInfoModal = document.getElementById('more-info-modal');
      var moreInfoTitle = document.getElementById('more-info-modal-title');
      var moreInfoBody = document.getElementById('more-info-modal-body');
      function closeMoreInfoModal() { moreInfoModal.classList.add('hidden'); }
      document.getElementById('more-info-modal-close').addEventListener('click', closeMoreInfoModal);
      document.getElementById('more-info-modal-backdrop').addEventListener('click', closeMoreInfoModal);

      cardsGrid.addEventListener('click', function (e) {
        var moreInfoBtn = e.target.closest('.more-info-link');
        if (moreInfoBtn) {
          var product = productById(moreInfoBtn.dataset.productId);
          if (!product) return;
          moreInfoTitle.textContent = product.name;
          moreInfoBody.textContent = product.extendedDescription;
          moreInfoModal.classList.remove('hidden');
          return;
        }
        var btn = e.target.closest('.request-allocation-btn');
        if (!btn) return;
        var card = btn.closest('[data-product-id]');
        var productId = card.dataset.productId;
        var product = productById(productId);
        var input = card.querySelector('.allocation-amount-input');
        var amount = parseFloat(input.value);

        if (!amount || amount <= 0) {
          input.focus();
          input.classList.add('border-red-400');
          setTimeout(function () { input.classList.remove('border-red-400'); }, 1500);
          return;
        }

        try {
          requestAllocation(productId, amount);
          showToast('Allocation Request Sent', '$' + amount.toLocaleString() + ' requested for ' + product.name + '. Pending Portfolio Manager approval.', false);
          input.value = '';
        } catch (err) {
          showToast('Request Not Sent', err.message, true);
        }
      });
    })();
  </script>
</body>
</html>
