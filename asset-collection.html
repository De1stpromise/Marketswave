  <script>
    // No dedicated nav item for this page (the locked sidebar menu order is fixed — see
    // CLAUDE.md — and this page wasn't asked to join it). Highlights 'asset-performance'
    // instead, the same "still within this section" treatment, since this page's entire
    // content used to live physically on asset-performance.html and is reached via a link
    // from there, not a standalone destination in its own right.
    initDashboardSidebar('asset-performance');
    initDashboardNotifications();
    initChatWidget();
  </script>

  <script>
    // UI Wiring — Stage 2 (2026-09-03): the product catalog and holdings-dependent card state
    // (badges, "already holding this" indicators) now come from real Supabase — a direct
    // RLS-authorized `products` read plus Phase B Stage 1's get-holdings — and Request
    // Allocation calls the real Phase B Stage 3 request-allocation Edge Function instead of
    // the local engine. Reuses supabase-data.js's canonical pattern exactly (renderAsyncBundle
    // for the read, withButtonBusy/callFunction/writeErrorMessage for the write) — see that
    // file's own header comments for the full convention this stage did not reinvent.
    //
    // Products Catalog Fix (2026-09-03): closes the real gap flagged when this stage was
    // originally built — the real `products` table now genuinely carries
    // description/extended_description/logo_url (a new migration + admin-only
    // add-product/edit-product Edge Functions, see admin-products.html's own header comment
    // for the full fix), so these three fields are now mapped for real below instead of left
    // undefined. The existing card-rendering code needed ZERO changes — it already handled an
    // unset value for each of these gracefully (no logo box outside its category default,
    // initials fallback, no "More info" link when extendedDescription is empty), and that
    // same code now renders a REAL value once one is actually set through the real admin UI.
    //
    // Search (by name), the category filter, and "Load More" are all unchanged in behavior —
    // they operate on the SAME already-fetched arrays as before, just populated asynchronously
    // now instead of synchronously at page load.
    (function () {
      if (typeof MarketswaveData === 'undefined') return; // supabase-data.js failed to load — bail defensively

      var UNALLOCATABLE_CLASS = 'Unallocated / Cash';
      var PAGE_SIZE = 9;

      function formatUSD(n, decimals) {
        var sign = n < 0 ? '-' : '';
        var abs = Math.abs(n);
        return sign + '$' + abs.toLocaleString('en-US', {
          minimumFractionDigits: decimals || 0,
          maximumFractionDigits: decimals || 0
        });
      }

      // Real holdings/products, populated once the async load below resolves — everything
      // that reads these is only ever invoked from inside render()/the click handler, both of
      // which only run after that first population (render() is only ever called from the
      // async render() callback or from a control wired up inside it).
      var holdings = [];
      var allocatableProducts = [];
      // Product catalog — fund documents, part 2 (2026-09-12): which products carry a
      // PUBLISHED fund document, from get-product-document's list mode. A product with no
      // published document simply shows no link — never a link to an empty page.
      var publishedDocumentIds = {};

      function holdingByProductId(id) { return holdings.find(function (h) { return h.productId === id; }); }
      function productById(id) { return allocatableProducts.find(function (p) { return p.id === id; }); }

      // Pure port of engine-core.js's own getUnrealizedReturnPercent(productId) — real holding
      // + real live unit_price, computed client-side from the already-fetched data rather than
      // a dedicated Edge Function (no server-side-only logic here worth a round trip for).
      function getUnrealizedReturnPercent(productId) {
        var holding = holdingByProductId(productId);
        if (!holding || holding.costBasis === 0) return 0;
        var product = productById(productId);
        if (!product) return 0;
        var unrealized = holding.units * product.unitPrice - holding.costBasis;
        return Math.round((unrealized / holding.costBasis) * 10000) / 100;
      }

      // ---- Search + filter — pure functions, same shape as admin-clients.html's own
      // matchesSearch()/matchesTypeFilter()/applyFilters() precedent. ----
      function matchesSearch(product, query) {
        if (!query) return true;
        return product.name.toLowerCase().indexOf(query.trim().toLowerCase()) !== -1;
      }
      function matchesCategory(product, category) {
        if (!category) return true;
        return product.assetClass === category;
      }
      function applyFilters(productsArr, query, category) {
        return productsArr.filter(function (p) { return matchesSearch(p, query) && matchesCategory(p, category); });
      }

      var searchQuery = '';
      var categoryFilter = '';
      var visibleCount = PAGE_SIZE;

      // Logo box (Stocks & ETFs/Crypto only) — real image if logoUrl is set, otherwise
      // initials derived from the product name via the same getClientInitials() logic
      // client identity avatars already use elsewhere. Both nodes are always rendered when a
      // logo is present; the fallback stays hidden until the image actually fails to load
      // (wired via a real 'error' listener after render, not an inline handler — this
      // project doesn't use inline event attributes anywhere else), so a bad/broken logoUrl
      // degrades to initials instead of a broken-image icon.
      function logoBoxHTML(product) {
        var initials = (typeof getClientInitials === 'function') ? getClientInitials(product.name) : '';
        var hasLogo = !!product.logoUrl;
        return '<div class="w-7 h-7 rounded-md bg-slate-100 flex-shrink-0 overflow-hidden flex items-center justify-center">' +
          (hasLogo ? '<img src="' + product.logoUrl + '" alt="" class="product-logo-img w-full h-full object-cover" data-product-id="' + product.id + '">' : '') +
          '<span class="product-logo-fallback text-slate-500 text-[10px] font-semibold' + (hasLogo ? ' hidden' : '') + '">' + initials + '</span>' +
          '</div>';
      }

      // ---- Live pricing, part 1 (2026-09-11): the price block and its SOURCE line ----
      // Green dot: market price with the time it was taken. Grey dot: the same, but older
      // than two missed refreshes — shown WITH its timestamp and still allocatable (the PM
      // re-reads the price at approval, so a stale quote is never a stale execution). Amber:
      // valued by appraisal, with the last-valued date. Ticker chip and "Fractional units"
      // appear on market-priced products only.
      var STALE_AFTER_MS = 30 * 60 * 1000;
      function formatAsOf(iso) {
        var d = new Date(iso);
        var time = d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
        var sameDay = d.toDateString() === new Date().toDateString();
        return sameDay ? time : d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short' }) + ', ' + time;
      }
      function formatValuedDate(ymd) {
        if (!ymd) return '—';
        var d = new Date(ymd + 'T00:00:00Z');
        return d.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric', timeZone: 'UTC' });
      }
      function priceSourceHTML(product) {
        if (product.pricingModel === 'market') {
          var stale = !product.priceAsOf || (Date.now() - new Date(product.priceAsOf).getTime() > STALE_AFTER_MS);
          var when = product.priceAsOf ? 'as of ' + formatAsOf(product.priceAsOf) : 'awaiting refresh';
          return '<p class="price-source flex items-center gap-1.5 text-[11px] text-slate-600 pt-2.5 mt-1 border-t border-slate-200" data-source="' + (stale ? 'stale' : 'live') + '">' +
            '<span class="inline-block w-1.5 h-1.5 rounded-full ' + (stale ? 'bg-slate-400' : 'bg-emerald-600') + '" aria-hidden="true"></span>' +
            'Market price · <b class="font-semibold text-slate-700">' + when + '</b>' + (stale && product.priceAsOf ? ' — awaiting refresh' : '') +
          '</p>';
        }
        if (product.pricingModel === 'appraisal') {
          return '<p class="price-source flex items-center gap-1.5 text-[11px] text-slate-600 pt-2.5 mt-1 border-t border-slate-200" data-source="appraisal">' +
            '<span class="inline-block w-1.5 h-1.5 rounded-full bg-amber-500" aria-hidden="true"></span>' +
            'Valued by appraisal · <b class="font-semibold text-slate-700">last valued ' + formatValuedDate(product.lastTickDate) + '</b>' +
          '</p>';
        }
        return '';
      }
      function priceBlockHTML(product) {
        var pct = product.priceChangePercent;
        var chg = '';
        if (typeof pct === 'number' && isFinite(pct) && pct !== 0) {
          chg = '<span class="price-change text-sm font-bold tabular-nums ' + (pct > 0 ? 'text-emerald-800' : 'text-red-700') + '">' + (pct > 0 ? '+' : '\u2212') + Math.abs(pct).toFixed(2) + '%</span>';
        }
        // flex-wrap + a smaller size below sm: a five-figure crypto price next to a change
        // figure escaped a 320px card in a single non-wrapping row (caught by measurement).
        return '<div class="flex flex-wrap items-end justify-between gap-x-3 gap-y-1 mb-1">' +
          '<div><p class="product-price text-xl sm:text-2xl font-semibold text-navy tabular-nums leading-none">$' + Number(product.unitPrice).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + '</p><p class="text-[11px] text-slate-500 mt-1">per unit</p></div>' +
          chg +
        '</div>' + priceSourceHTML(product);
      }

      function cardHTML(product) {
        var holding = holdingByProductId(product.id);
        var badgeHtml;
        if (holding) {
          var pct = getUnrealizedReturnPercent(product.id);
          var pctColor = pct > 0 ? 'bg-emerald-50 text-emerald-700' : (pct < 0 ? 'bg-red-50 text-red-700' : 'bg-slate-100 text-slate-600');
          badgeHtml = '<span class="text-xs font-medium px-2 py-1 rounded-full ' + pctColor + '">' + (pct > 0 ? '+' : '') + pct.toFixed(1) + '%</span>';
        } else {
          badgeHtml = '<span class="text-xs font-medium px-2 py-1 rounded-full bg-slate-100 text-slate-500">No position</span>';
        }
        var allocatedLine = holding ? 'Allocated: ' + formatUSD(Math.round(holding.costBasis)) : 'Not yet allocated';

        // Logo box (Stocks & ETFs/Crypto) and "More info" popup link (Private Equity/Real
        // Assets) are mutually exclusive by category, both minimal by design — neither
        // competes with Request Allocation for visual weight. Both degrade cleanly when the
        // underlying field is unset: no logo box renders for a product missing logoUrl
        // outside its category (not applicable), and no "More info" link renders at all when
        // extendedDescription is empty, rather than opening on nothing.
        var showLogo = product.assetClass === 'Stocks & ETFs' || product.assetClass === 'Crypto';
        var showMoreInfo = (product.assetClass === 'Private Equity' || product.assetClass === 'Real Assets') && product.extendedDescription;

        // flex flex-col + mt-auto on the CTA block — unchanged from the original card,
        // anchors the input/button to the bottom of the card regardless of how many lines
        // the content above it takes (description length now varies this further).
        return '<div class="border border-slate-200 rounded-xl p-5 hover:border-navy/30 transition flex flex-col" data-product-id="' + product.id + '">' +
          '<div class="flex items-start justify-between mb-3">' +
          '<div class="flex items-start gap-2.5">' +
          (showLogo ? logoBoxHTML(product) : '') +
          '<div><p class="font-medium text-navy">' + product.name + '</p>' +
          '<p class="text-xs text-slate-500 mt-0.5">' + product.assetClass + '</p></div>' +
          '</div>' +
          '<div class="flex items-center gap-2 shrink-0">' +
          (product.pricingModel === 'market' && product.ticker ? '<span class="product-ticker text-[11px] font-bold tracking-wide text-slate-600 bg-slate-100 px-2 py-0.5 rounded">' + product.ticker + '</span>' : '') +
          badgeHtml +
          '</div>' +
          '</div>' +
          priceBlockHTML(product) +
          (product.description ? '<p class="text-sm text-slate-600 mb-1">' + product.description + '</p>' : '') +
          (showMoreInfo ? '<button type="button" class="more-info-link mw-btn mw-btn-secondary mw-btn-sm mb-2" data-product-id="' + product.id + '">More info</button>' : '') +
          (publishedDocumentIds[product.id] ? '<a class="fund-document-link mw-btn mw-btn-secondary mw-btn-sm mb-2" href="fund-document.html?product=' + encodeURIComponent(product.id) + '" data-product-id="' + product.id + '">Fund document</a>' : '') +
          '<p class="text-sm text-slate-600 mb-1">' + allocatedLine + '</p>' +
          '<p class="text-xs text-slate-500 mb-4">Minimum ' + formatUSD(product.minimumInvestment) + (product.maximumInvestment != null ? ' · Maximum ' + formatUSD(product.maximumInvestment) : '') + (product.pricingModel === 'market' ? ' · <span class="fractional-note">Fractional units</span>' : '') + '</p>' +
          '<div class="mt-auto">' +
          '<div class="mw-fld mb-3">' +
          '<input type="number" min="0" step="100" placeholder=" " id="alloc-amt-' + product.id + '" class="allocation-amount-input mw-field mw-field-sm">' +
          '<label for="alloc-amt-' + product.id + '">Requested Allocation Amount</label>' +
          '</div>' +
          '<button type="button" class="request-allocation-btn mw-btn mw-btn-outline mw-btn-block">Request Allocation</button>' +
          '</div>' +
          '</div>';
      }

      var cardsGrid = document.getElementById('asset-cards-grid');
      var noResultsEl = document.getElementById('no-results');
      var loadMoreBtn = document.getElementById('load-more-btn');
      var dataLoaded = false; // guards render() against firing on a search/tab/load-more
      // interaction that happens to land during the initial async load, before there is
      // real data to filter/render against.

      function render() {
        if (!dataLoaded) return;
        var filtered = applyFilters(allocatableProducts, searchQuery, categoryFilter);
        var visible = filtered.slice(0, visibleCount);

        if (filtered.length === 0) {
          cardsGrid.innerHTML = '';
          noResultsEl.classList.remove('hidden');
          loadMoreBtn.classList.add('hidden');
          return;
        }
        noResultsEl.classList.add('hidden');
        cardsGrid.innerHTML = visible.map(cardHTML).join('');
        loadMoreBtn.classList.toggle('hidden', visibleCount >= filtered.length);

        // Real 'error' listener per rendered logo image (not an inline onerror attribute —
        // this project doesn't use inline event handlers anywhere else) — falls back to the
        // adjacent initials span rather than showing a broken-image icon.
        cardsGrid.querySelectorAll('.product-logo-img').forEach(function (img) {
          img.addEventListener('error', function () {
            img.classList.add('hidden');
            var fallback = img.nextElementSibling;
            if (fallback) fallback.classList.remove('hidden');
          });
        });
      }

      // ---- Async load: product catalog + holdings, the real replacement for the old
      // synchronous getAllProducts()/getHoldings() reads. ----
      MarketswaveData.renderAsyncBundle(cardsGrid, {
        skeletonHTML: new Array(3).fill(
          '<div class="border border-slate-200 rounded-xl p-5 space-y-3">' +
            MarketswaveData.skeleton.block('w-3/4', { height: 'h-5' }) +
            MarketswaveData.skeleton.block('w-1/2') +
            MarketswaveData.skeleton.block('w-full', { height: 'h-10' }) +
            '</div>'
        ).join(''),
        load: function () {
          return Promise.all([
            MarketswaveData.selectTable('products'),
            MarketswaveData.callFunction('get-holdings'),
            // A failure here must not take the whole catalog down — the cards still render,
            // just without document links until the next load.
            MarketswaveData.callFunction('get-product-document', {}).catch(function () { return { published: [] }; })
          ]).then(function (results) {
            publishedDocumentIds = {};
            ((results[2] && results[2].published) || []).forEach(function (d) { publishedDocumentIds[d.productId] = true; });
            return {
              products: results[0].map(function (p) {
                return {
                  id: p.id, name: p.name, assetClass: p.asset_class, investmentType: p.investment_type,
                  minimumInvestment: p.minimum_investment, unitPrice: p.unit_price,
                  description: p.description, extendedDescription: p.extended_description, logoUrl: p.logo_url,
                  // Live pricing, part 1 (2026-09-11): the price source a card must state explicitly.
                  ticker: p.ticker, pricingModel: p.pricing_model, priceAsOf: p.price_as_of,
                  priceChangePercent: p.price_change_percent, priceStatus: p.price_status,
                  lastTickDate: p.last_tick_date, maximumInvestment: p.maximum_investment
                };
              }),
              holdings: results[1]
            };
          });
        },
        render: function (data) {
          allocatableProducts = data.products.filter(function (p) { return p.assetClass !== UNALLOCATABLE_CLASS; });
          holdings = data.holdings;
          dataLoaded = true;
          focusRequestedProduct();
          render();
        }
      });

      // ---- ?product=PROD-XXXX ------------------------------------------------------
      // The watchlist card's Allocate button (2026-09-11) links here with the catalog
      // product it resolved the symbol to. Without this the button would land the client on
      // an unfiltered grid and leave them to find the product themselves, which is not a
      // real action. It reuses this page's OWN existing search state rather than adding a
      // second filtering path — the search box visibly carries the product's name, so the
      // filter is explained and the client can clear it the ordinary way.
      function focusRequestedProduct() {
        var params = new URLSearchParams(window.location.search);
        var requested = params.get('product');
        if (!requested) return;
        var match = allocatableProducts.filter(function (p) { return p.id === requested; })[0];
        if (!match) return; // a product that is no longer allocatable simply shows the full grid
        searchQuery = match.name;
        var box = document.getElementById('asset-search');
        if (box) box.value = match.name;
      }

      // ---- Search ----
      document.getElementById('asset-search').addEventListener('input', function (e) {
        searchQuery = e.target.value;
        visibleCount = PAGE_SIZE; // a new search always starts from the first page again
        render();
      });

      // ---- Category tab filtering ----
      var tabs = document.querySelectorAll('.category-tab');
      tabs.forEach(function (tab) {
        tab.addEventListener('click', function () {
          tabs.forEach(function (t) {
            t.classList.remove('bg-navy', 'text-white');
            t.classList.add('bg-slate-100', 'text-slate-600');
          });
          tab.classList.remove('bg-slate-100', 'text-slate-600');
          tab.classList.add('bg-navy', 'text-white');

          categoryFilter = tab.dataset.category;
          visibleCount = PAGE_SIZE; // a new filter always starts from the first page again
          render();
        });
      });

      // ---- Load More ----
      loadMoreBtn.addEventListener('click', function () {
        visibleCount += PAGE_SIZE;
        render();
      });

      // ---- Request Allocation: identical engine wiring to the original card ----
      var toast = document.getElementById('allocation-toast');
      var toastTitle = document.getElementById('allocation-toast-title');
      var toastBody = document.getElementById('allocation-toast-body');
      var toastTimer;

      function showToast(title, body, isError) {
        toastTitle.textContent = title;
        toastBody.textContent = body;
        toast.classList.toggle('bg-red-700', !!isError);
        toast.classList.toggle('bg-navy', !isError);
        toast.classList.remove('hidden');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toast.classList.add('hidden'); }, 4000);
      }

      // ---- "More info" popup (Private Equity/Real Assets) ----
      var moreInfoModal = document.getElementById('more-info-modal');
      var moreInfoTitle = document.getElementById('more-info-modal-title');
      var moreInfoBody = document.getElementById('more-info-modal-body');
      function closeMoreInfoModal() { moreInfoModal.classList.add('hidden'); }
      document.getElementById('more-info-modal-close').addEventListener('click', closeMoreInfoModal);
      document.getElementById('more-info-modal-backdrop').addEventListener('click', closeMoreInfoModal);

      cardsGrid.addEventListener('click', function (e) {
        var moreInfoBtn = e.target.closest('.more-info-link');
        if (moreInfoBtn) {
          var product = productById(moreInfoBtn.dataset.productId);
          if (!product) return;
          moreInfoTitle.textContent = product.name;
          moreInfoBody.textContent = product.extendedDescription;
          moreInfoModal.classList.remove('hidden');
          return;
        }
        var btn = e.target.closest('.request-allocation-btn');
        if (!btn) return;
        var card = btn.closest('[data-product-id]');
        var productId = card.dataset.productId;
        var product = productById(productId);
        var input = card.querySelector('.allocation-amount-input');
        var amount = parseFloat(input.value);

        if (!amount || amount <= 0) {
          input.focus();
          input.classList.add('border-red-400');
          setTimeout(function () { input.classList.remove('border-red-400'); }, 1500);
          return;
        }

        // This project's FIRST real write action. The only real client-side check that
        // existed before this stage — a plain positive-number check, above — is unchanged;
        // investigated and confirmed the local requestAllocation() itself never had a
        // separate minimum-investment/sufficient-capital pre-check either (those were always
        // enforced by the callee's own thrown validation, never duplicated client-side) — so
        // "the server is authoritative" was already true architecturally, not something this
        // stage had to newly establish. request-allocation/index.ts re-validates both rules
        // for real, server-side, against the real current unallocated_capital, and its exact
        // rejection message is shown verbatim via writeErrorMessage() below (see
        // supabase-data.js's own callFunction()/classifyError() header for why that needs a
        // real Response body read to work at all, not just the generic HTTP-status string).
        MarketswaveData.withButtonBusy(btn, 'Sending...', function () {
          return MarketswaveData.callFunction('request-allocation', { productId: productId, dollarAmount: amount });
        }).then(function () {
          showToast('Allocation Request Sent', '$' + amount.toLocaleString() + ' requested for ' + product.name + '. Pending Portfolio Manager approval.', false);
          input.value = '';
        }).catch(function (err) {
          showToast('Request Not Sent', MarketswaveData.writeErrorMessage(err), true);
        });
      });
    })();
  </script>
</body>
</html>
