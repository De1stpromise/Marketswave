<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Approval gate — Marketswave PM Tool</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="glass-primitives.css" />
  <link rel="stylesheet" href="tap-targets.css">
  <link rel="stylesheet" href="control-patterns.css">
  <link rel="stylesheet" href="admin-nav.css">
  <link rel="stylesheet" href="admin-approvals.css">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased">

  <div class="flex h-screen overflow-hidden">
    <div id="admin-sidebar-mount"></div>

    <div class="flex-1 flex flex-col overflow-hidden">
      <div class="bg-red-600 text-white text-xs font-semibold tracking-wide uppercase text-center py-1.5 px-4">
        Internal Tool — Portfolio Manager Access Only — Not the Client-Facing Site
      </div>

      <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between pl-16 pr-8 lg:pl-8">
        <div>
          <p class="text-sm font-medium text-slate-900" id="live-day">Loading...</p>
          <p class="text-xs text-slate-500" id="live-date-time"></p>
        </div>
      </header>

      <main class="flex-1 overflow-y-auto overflow-x-hidden p-8 relative">
        <div class="blob blob--sm blob--teal -z-10" style="top:-80px; right:-60px;" aria-hidden="true"></div>

        <!-- ★ PM tool revamp, part 3 (2026-09-15). THE APPROVAL GATE.
             One pending queue for all seven request types, one history, seven panel shapes.
             This replaces the interim landing (vocabulary §12) AND the seven separate queue
             pages, which are retired.

             The idea, and why the panel is not generic: the QUEUE unifies *seeing* — one list,
             oldest first, so "what needs me" has a single answer. The PANEL is shaped by the
             type so that *doing* stays correct. Seven shapes, one page. -->

        <div class="ag-top">
          <div>
            <h1>Approval gate</h1>
            <p>Everything waiting on a portfolio manager, oldest first.</p>
          </div>
          <span class="ag-oldest" id="ag-oldest" hidden><i></i><span id="ag-oldest-text"></span></span>
        </div>

        <div class="ag-vsw" role="tablist" aria-label="Approval views">
          <button class="ag-vt is-on" id="ag-view-pending" role="tab" aria-selected="true">Pending <span class="ag-n" id="ag-pending-count">—</span></button>
          <button class="ag-vt" id="ag-view-history" role="tab" aria-selected="false">History</button>
        </div>

        <!-- PENDING ------------------------------------------------------------------->
        <section id="ag-pending-view">
          <div class="ag-bar" id="ag-filters" role="group" aria-label="Filter by request type"></div>
          <div id="ag-queue" aria-live="polite"></div>
        </section>

        <!-- HISTORY ------------------------------------------------------------------->
        <section id="ag-history-view" hidden>
          <div class="ag-hwrap">
            <div class="ag-hbar" id="ag-hfilters" role="group" aria-label="Filter history by request type"></div>
            <div class="ag-hscroll">
              <div class="ag-hh" id="ag-hhead"></div>
              <div id="ag-hrows"></div>
            </div>
          </div>
        </section>
      </main>
    </div>
  </div>

  <!-- the panel, one at a time, over a scrim -->
  <div class="ag-scrim" id="ag-scrim" hidden>
    <div class="ag-pane" role="dialog" aria-modal="true" aria-labelledby="ag-pane-title" id="ag-pane"></div>
  </div>

  <script src="engine-core.js"></script>
  <script src="format-helpers.js"></script>
  <script src="supabase-data.js"></script>
  <script src="admin-sidebar.js"></script>
  <script src="dashboard-common.js"></script>
  <!-- ★ MOUNT THE SHARED ADMIN NAV. Every admin page pairs the empty #admin-sidebar-mount div
       above with this call; the only page that must NOT make it is admin-login.html, which has
       no sidebar by design so it cannot redirect-loop against itself. This was missing when the
       gate first shipped, which left the busiest page in the PM tool with no navigation and no
       Log out control at all — and neither a real browser render nor the gate's own 69-assertion
       visual suite caught it, because both looked at the queue and never at the chrome around it.
       verify-approval-gate-visual now asserts the nav mounts here. -->
  <script>
    initAdminSidebar('approvals');
  </script>
  <!-- All of the gate's own queue logic lives in one external file: it is long enough that an
       inline block would be the biggest thing on the page. -->
  <script src="admin-approvals-page.js"></script>
</body>
</html>
