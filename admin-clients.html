<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client List — Marketswave PM Tool</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="glass-primitives.css" />
  <link rel="stylesheet" href="tap-targets.css">
  <link rel="stylesheet" href="control-patterns.css">
  <link rel="stylesheet" href="admin-nav.css">
  <link rel="stylesheet" href="responsive-tables.css">
  <link rel="stylesheet" href="admin-client-list.css">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased">

  <div class="flex h-screen overflow-hidden">

    <div id="admin-sidebar-mount"></div>

    <div class="flex-1 flex flex-col overflow-hidden">

      <div class="bg-red-600 text-white text-xs font-semibold tracking-wide uppercase text-center py-1.5 px-4">
        Internal Tool — Portfolio Manager Access Only — Not the Client-Facing Site
      </div>

      <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between pl-16 pr-8 lg:pl-8">
        <div>
          <p class="text-sm font-medium text-slate-900" id="live-day">Loading...</p>
          <p class="text-xs text-slate-500" id="live-date-time"></p>
        </div>
      </header>

      <main class="flex-1 overflow-y-auto overflow-x-hidden p-8 relative">
        <span class="blob blob--sm blob--teal" style="top:-60px;right:-40px" aria-hidden="true"></span>
        <div class="cl-wrap mx-auto">

          <div class="flex items-end justify-between gap-4 flex-wrap mb-4">
            <div>
              <h2 class="text-2xl font-semibold text-slate-900">Clients</h2>
              <p class="text-sm text-slate-600 mt-1">Every account, with what it holds and what it needs.</p>
            </div>
            <button type="button" id="open-add-modal" class="mw-btn mw-btn-admin mw-btn-sm shrink-0">+ Add client</button>
          </div>

          <!-- strip: four figures, none of which existed before -->
          <div class="cl-strip" id="cl-strip"></div>

          <!-- filters + search -->
          <div class="panel glass glass-lift cl-bar" id="cl-bar">
            <div id="cl-filters" class="contents"></div>
            <div class="cl-srch">
              <span class="cl-ic" aria-hidden="true"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
              <label for="client-search" class="sr-only">Search clients</label>
              <input type="text" id="client-search" class="mw-field mw-field-admin" placeholder="Search name or email" />
            </div>
          </div>

          <div class="panel glass glass-lift" id="cl-panel">
            <div class="cl-th" id="cl-head"></div>
            <div id="clients-list"></div>
          </div>

        </div>
      </main>
    </div>
  </div>

  <!-- Add Client modal -->
  <div id="add-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/60" id="add-modal-backdrop"></div>
    <div class="relative bg-white rounded-2xl shadow-xl max-w-md w-full p-6">
      <div class="flex items-start justify-between mb-2">
        <p class="text-lg font-semibold text-slate-900">Add Client</p>
        <button type="button" id="add-modal-close" class="text-slate-400 hover:text-slate-900 transition text-xl leading-none">&times;</button>
      </div>
      <p class="text-sm text-slate-500 mb-4">Creates a genuinely new, isolated client account — empty holdings, no transactions, only a starting cash balance.</p>
      <div class="space-y-3">
        <div>
          <div class="mw-fld mw-fld--admin">
            <input type="text" id="add-name" class="mw-field mw-field-admin" placeholder="Jane Smith" />
            <label for="add-name">Name</label>
          </div>
        </div>
        <div>
          <div class="mw-fld mw-fld--static mw-fld--admin">
            <select id="add-account-type" class="mw-field mw-field-admin">
            <option value="Individual Account">Individual</option>
            <option value="Joint Account">Joint</option>
            <option value="Business Account">Business</option>
          </select>
            <label for="add-account-type">Account Type</label>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <div class="mw-fld mw-fld--admin">
              <input type="email" id="add-email" class="mw-field mw-field-admin" placeholder="jane@example.com" />
              <label for="add-email">Email</label>
            </div>
          </div>
          <div>
            <div class="mw-fld mw-fld--admin">
              <input type="text" id="add-phone" class="mw-field mw-field-admin" placeholder="+1 (555) 555-0100" />
              <label for="add-phone">Phone</label>
            </div>
          </div>
        </div>
        <div>
          <div class="mw-fld mw-fld--admin">
            <input type="number" id="add-starting-capital" step="0.01" min="0" class="mw-field mw-field-admin" placeholder="0.00" />
            <label for="add-starting-capital">Starting Unallocated Capital (USD)</label>
          </div>
        </div>
      </div>
      <p class="text-xs text-red-500 hidden mt-3" id="add-error"></p>
      <div class="flex gap-3 mt-5">
        <button type="button" id="add-cancel" class="mw-btn mw-btn-secondary mw-btn-grow">Cancel</button>
        <button type="button" id="add-submit" class="mw-btn mw-btn-admin mw-btn-grow">Add Client</button>
      </div>
    </div>
  </div>

  <!-- The Security Action modal that used to live here MOVED to admin-client-profile.html
       with its two actions (register row 235) — the expander became navigation, and Reset
       Password / Reset 2FA were the only things in it with no other home. -->

  <!-- Toast -->
  <div id="admin-toast" class="hidden fixed bottom-6 right-6 bg-slate-900 text-white rounded-xl shadow-lg px-5 py-4 max-w-sm z-50">
    <div class="flex items-start justify-between gap-3">
      <div class="min-w-0">
        <p class="font-medium text-sm" id="admin-toast-title">Done</p>
        <p class="text-sm text-white/80 mt-0.5" id="admin-toast-body"></p>
      </div>
      <button type="button" id="admin-toast-close" class="hidden text-white/60 hover:text-white transition text-lg leading-none shrink-0">&times;</button>
    </div>
  </div>

  <script src="admin-sidebar.js"></script>
  <script src="dashboard-common.js"></script>
  <script src="engine-core.js"></script>
  <script src="supabase-data.js"></script>
  <script src="responsive-tables.js"></script>
  <script>
    initAdminSidebar('clients');
  </script>

  <!-- Admin UI Wiring — Final Stage (2026-09-03): real cleanup, not a straightforward wire,
       per instruction. This page was stuck on the pre-retirement Firebase merge built Aug 22,
       2026 — Firebase was retired project-wide Aug 30, 2026 (see CLAUDE.md's "Firebase —
       RETIRED" Tech Stack entry), and this page was never updated after that: it was still
       importing the retired admin-firebase-config.js and querying the retired emulator's
       Firestore `clients` collection, which no real signup path has written to since Supabase
       became the sole active backend. That merge is REMOVED outright (not merely disabled) —
       real clients now sign up through Supabase (signup.html's default path since Firebase
       Retirement), so the real cross-client source here is the real Supabase `clients` table,
       merged with the still-genuinely-local demo/admin-created clients (getAllClients()) the
       same way the old code merged local + Firebase. No `type="module"` needed any more —
       MarketswaveData (a plain classic script) covers everything this page needs. -->
  <script>
    // ★ PM tool revamp, part 5 (2026-09-15): the list itself lives in admin-client-list.js.
    // What remains here is the Add Client modal, which is unchanged — it still calls the local
    // engine's addClient(), exactly as before. Changing which backend a PM-created client is
    // written to is a real decision with its own consequences and is NOT part of this task.
    //
    // REMOVED with the expander (register row 235), each deliberately:
    //   - the raw UUID as an identifier — no readable reference exists to replace it with; see
    //     row 235 for what adding one would take. Name and email identify the row instead.
    //   - the "Supabase" badge — internal implementation on a PM-facing page; a client is a
    //     client. It also turned out to be the tell for the $0 bug, which is now fixed at the
    //     source rather than signposted.
    //   - "View as this Client" — WRITE-ONLY: setCurrentClientId() was called here and read by
    //     nothing in the admin tool (the seven queue pages that consumed it are retired, and
    //     every wired admin page takes an explicit clientId). engine-core.js keeps the
    //     functions; this page simply no longer calls them.
    //   - Reset Password / Reset 2FA — these were REAL actions with no other home, so they
    //     MOVED to the client profile rather than being dropped. The profile is where
    //     client-level detail and actions live now.
    (function () {
      var addModal = document.getElementById('add-modal');
      var addError = document.getElementById('add-error');
      function openAddModal() { addModal.classList.remove('hidden'); addError.classList.add('hidden'); }
      function closeAddModal() {
        addModal.classList.add('hidden');
        ['add-name', 'add-email', 'add-phone', 'add-starting-capital'].forEach(function (id) {
          var el = document.getElementById(id); if (el) el.value = '';
        });
      }
      document.getElementById('open-add-modal').addEventListener('click', openAddModal);
      document.getElementById('add-cancel').addEventListener('click', closeAddModal);
      document.getElementById('add-modal-backdrop').addEventListener('click', closeAddModal);

      document.getElementById('add-submit').addEventListener('click', function () {
        var name = (document.getElementById('add-name').value || '').trim();
        var email = (document.getElementById('add-email').value || '').trim();
        var phone = (document.getElementById('add-phone').value || '').trim();
        var accountType = document.getElementById('add-account-type').value;
        var startingCapital = parseFloat(document.getElementById('add-starting-capital').value) || 0;
        if (!name) {
          addError.textContent = 'Name is required.';
          addError.classList.remove('hidden');
          return;
        }
        try {
          var result = addClient({
            name: name, email: email || null, phone: phone || null,
            accountType: accountType, startingUnallocatedCapital: startingCapital
          });
          closeAddModal();
          if (window.MarketswaveClientList) window.MarketswaveClientList.reload();
        } catch (e) {
          addError.textContent = e.message;
          addError.classList.remove('hidden');
        }
      });
    })();
  </script>
  <script src="admin-client-list.js"></script>

</body>
</html>
