<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deposit addresses — Marketswave PM Tool</title>

  <!-- The Supabase SDK, self-hosted and preloaded here so it downloads beside the stylesheets instead of
       after the page script (row 258). Preload only: nothing evaluates until a page first imports it. -->
  <link rel="modulepreload" href="vendor/supabase-js-2.112.4.min.js" />
  <link rel="modulepreload" href="admin-supabase-config.js" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="glass-primitives.css" />
  <link rel="stylesheet" href="tap-targets.css">
  <link rel="stylesheet" href="control-patterns.css">
  <link rel="stylesheet" href="admin-nav.css">
  <link rel="stylesheet" href="asset-mark.css">
  <link rel="stylesheet" href="admin-deposit-addresses.css">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>

  <!-- Tailwind, compiled once (scripts/build-tailwind.mjs, row 260) — deliberately the LAST stylesheet in <head>:
       the play CDN it replaces appended its generated <style> after every other sheet, so utilities win
       equal-specificity contests; the position preserves that. -->
  <link rel="stylesheet" href="tailwind-3.4.17.css" />
</head>
<body class="bg-slate-100 text-slate-800 antialiased">

  <div class="flex h-screen overflow-hidden">
    <div id="admin-sidebar-mount"></div>

    <div class="flex-1 flex flex-col overflow-hidden">
      <div class="bg-red-600 text-white text-xs font-semibold tracking-wide uppercase text-center py-1.5 px-4">
        Internal Tool — Portfolio Manager Access Only — Not the Client-Facing Site
      </div>

      <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between pl-16 pr-8 lg:pl-8">
        <div>
          <h2 class="text-base font-semibold text-slate-900">Deposit addresses</h2>
          <p class="text-xs text-slate-600">Where every crypto deposit is told to go</p>
        </div>
      </header>

      <main class="flex-1 overflow-y-auto relative overflow-x-hidden p-6">
        <div class="da-wrap mx-auto">

          <div class="da-top">
            <div>
              <h2>Deposit addresses</h2>
              <p class="da-sub" id="da-sub">Loading…</p>
            </div>
            <button type="button" id="da-add-open" class="mw-btn mw-btn-admin mw-btn-sm">+ Add address</button>
          </div>

          <!-- ★ BLOCKED CLIENTS LEAD THE PAGE. A client with no address on a route cannot deposit
               that currency at all — deploy-capital shows them an honest empty state where an
               address should be. The Overview already counts this; this is where it gets fixed. -->
          <div id="da-blocked"></div>

          <div class="da-hs" id="da-strip"></div>

          <div class="da-bar">
            <div id="da-pills" style="display:flex;gap:7px;flex-wrap:wrap" role="group" aria-label="Filter addresses by status"></div>
          </div>

          <section class="da-panel" id="da-book" aria-label="Deposit address book"></section>
        </div>
      </main>
    </div>
  </div>

  <!-- One overlay hosts every panel — address detail, add, assign, remove. A PM only ever has
       one open, and a single scrim means one Escape handler and one place that can be dismissed. -->
  <div id="da-scrim" class="da-scrim" role="dialog" aria-modal="true" aria-labelledby="da-panel-title">
    <div class="da-panelbox" id="da-panel"></div>
  </div>

  <div id="da-toast" class="fixed bottom-6 right-6 z-[70] hidden max-w-sm rounded-lg bg-slate-900 px-4 py-3 text-sm text-white shadow-lg" role="status" aria-live="polite"></div>

  <script src="format-helpers.js"></script>
  <script src="asset-mark.js"></script>
  <script src="supabase-data.js"></script>
  <script src="admin-sidebar.js"></script>
  <script src="dashboard-common.js"></script>
  <!-- ★ MOUNT THE SHARED ADMIN NAV. The approval gate shipped without this exact line and
       rendered reachable then inescapable — no rail, no active item, no Log out — and neither a
       real browser render nor a 69-assertion suite caught it, because everything looked at the
       feature and nothing at the chrome (register row 228). Only admin-login.html may omit it.
       This page's own suites assert the nav mounts, for that reason. -->
  <script>
    initAdminSidebar('deposit-addresses');
  </script>
  <script src="admin-deposit-addresses-page.js"></script>
</body>
</html>
