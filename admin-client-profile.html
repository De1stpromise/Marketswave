<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Client profile — Marketswave PM Tool</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="glass-primitives.css" />
  <link rel="stylesheet" href="tap-targets.css">
  <link rel="stylesheet" href="control-patterns.css">
  <link rel="stylesheet" href="admin-nav.css">
  <link rel="stylesheet" href="asset-mark.css">
  <link rel="stylesheet" href="admin-client-profile.css">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased">

  <div class="flex h-screen overflow-hidden">
    <div id="admin-sidebar-mount"></div>

    <div class="flex-1 flex flex-col overflow-hidden">
      <div class="bg-red-600 text-white text-xs font-semibold tracking-wide uppercase text-center py-1.5 px-4">
        Internal Tool — Portfolio Manager Access Only — Not the Client-Facing Site
      </div>

      <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between pl-16 pr-8 lg:pl-8">
        <div>
          <h2 class="text-base font-semibold text-slate-900">Client profile</h2>
          <p class="text-xs text-slate-600" id="cp-sub">Loading…</p>
        </div>
      </header>

      <main class="flex-1 overflow-y-auto relative overflow-x-hidden p-6">
        <div class="cp-wrap mx-auto">

          <nav class="cp-crumb" aria-label="Breadcrumb">
            <a href="admin-clients.html">Clients</a>
            <span aria-hidden="true">›</span>
            <b id="cp-crumb-name">…</b>
          </nav>

          <!-- identity + money strip -->
          <section class="panel glass glass-lift" id="cp-identity" aria-label="Client identity"></section>

          <!-- tabs -->
          <div class="cp-tabs" id="cp-tabs" role="tablist" aria-label="Profile sections"></div>

          <!-- overview body -->
          <div class="cp-body">
            <div class="cp-col">
              <section class="panel glass glass-lift cp-card" id="cp-attention" aria-label="Needs your attention"></section>
              <section class="panel glass glass-lift cp-card" id="cp-holdings" aria-label="Holdings"></section>
              <section class="panel glass glass-lift cp-card" id="cp-activity" aria-label="Recent activity"></section>
              <section class="panel glass glass-lift cp-card" id="cp-addresses" aria-label="Crypto deposit addresses"></section>
            </div>
            <div class="cp-col">
              <section class="panel glass glass-lift cp-card" id="cp-onboarding" aria-label="Onboarding"></section>
              <section class="panel glass glass-lift cp-card" id="cp-documents" aria-label="Documents"></section>
              <section class="panel glass glass-lift cp-card" id="cp-conversations" aria-label="Conversations"></section>
              <section class="panel glass glass-lift cp-card" id="cp-watchlist" aria-label="Watchlist"></section>
              <section class="panel glass glass-lift cp-card" id="cp-notes" aria-label="Private notes"></section>
              <section class="panel glass glass-lift cp-card" id="cp-health" aria-label="Account health"></section>
              <section class="panel glass glass-lift cp-card" id="cp-security" aria-label="Security actions"></section>
            </div>
          </div>

        </div>
      </main>
    </div>
  </div>

  <!-- ★ Reset Password / Reset 2FA MOVED HERE from the client list's expander (register row
       235). They were real actions with no other home once the expander became navigation, and
       the profile is where client-level detail and actions live now. A reason is required: no
       silent, reason-less reset. -->
  <div id="cp-sec-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center p-4">
    <div class="absolute inset-0 bg-black/60" id="cp-sec-backdrop"></div>
    <div class="relative bg-white rounded-xl shadow-xl w-full max-w-md p-6">
      <div class="flex items-start justify-between mb-2">
        <p class="text-lg font-semibold text-slate-900" id="cp-sec-title">Reset Password</p>
        <button type="button" id="cp-sec-close" class="mw-btn mw-btn-sm" aria-label="Close">&times;</button>
      </div>
      <p class="text-sm text-slate-600 mb-4" id="cp-sec-desc"></p>
      <div id="cp-sec-warn" class="hidden mb-4 rounded-lg border border-amber-200 bg-amber-50 p-3 text-xs text-amber-800"></div>
      <label for="cp-sec-reason" class="block text-xs font-semibold text-slate-600 mb-1">Reason (required)</label>
      <textarea id="cp-sec-reason" rows="3" class="mw-field mw-field-admin w-full" placeholder="Why is this being reset?"></textarea>
      <p id="cp-sec-error" class="hidden text-xs text-red-700 mt-2"></p>
      <div class="flex gap-2 mt-4">
        <button type="button" id="cp-sec-submit" class="mw-btn mw-btn-sm mw-btn-danger">Confirm reset</button>
        <button type="button" id="cp-sec-cancel" class="mw-btn mw-btn-sm">Cancel</button>
      </div>
    </div>
  </div>

  <div id="cp-toast" class="fixed bottom-6 right-6 z-50 hidden max-w-sm rounded-lg bg-slate-900 px-4 py-3 text-sm text-white shadow-lg" role="status" aria-live="polite"></div>

  <script src="engine-core.js"></script>
  <script src="format-helpers.js"></script>
  <script src="asset-mark.js"></script>
  <script src="supabase-data.js"></script>
  <script src="admin-sidebar.js"></script>
  <script src="dashboard-common.js"></script>
  <!-- ★ MOUNT THE SHARED ADMIN NAV. Every admin page pairs the empty #admin-sidebar-mount div
       above with this call; the only page that must NOT make it is admin-login.html, which has
       no sidebar by design so it cannot redirect-loop against itself. The approval gate (part 3)
       shipped without this exact line and rendered with no navigation and no Log out control —
       reachable, then inescapable — and neither a real browser render nor a 69-assertion visual
       suite caught it, because everything looked at the feature and nothing at the chrome
       (register row 228). This page's own suite asserts the nav mounts, for that reason.
       'clients' is the key: a client profile is a detail view of the Clients list, so that item
       is the one that highlights. -->
  <script>
    initAdminSidebar('clients');
  </script>
  <script src="admin-client-profile.js"></script>
</body>
</html>
