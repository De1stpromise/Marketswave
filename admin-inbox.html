<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inbox — Marketswave PM Tool</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="glass-primitives.css" />
  <style>
    body { font-family: 'Inter', sans-serif; }
    .convo-row.is-active { background: #F1F5F9; }
    .convo-row:hover { background: #F8FAFC; }
    .filter-pill { cursor: pointer; user-select: none; }
    .filter-pill.is-active { background: #0F172A; color: #fff; }
    .inbox-msg-row { display: flex; }
    .inbox-msg-row.is-inbound { justify-content: flex-start; }
    .inbox-msg-row.is-outbound { justify-content: flex-end; }
    .inbox-msg-bubble { max-width: 75%; padding: 9px 14px; border-radius: 14px; font-size: 13.5px; line-height: 1.5; word-wrap: break-word; }
    .inbox-msg-row.is-inbound .inbox-msg-bubble { background: #F1F5F9; color: #0F172A; border-bottom-left-radius: 4px; }
    .inbox-msg-row.is-outbound .inbox-msg-bubble { background: #1B3A4B; color: #F7F6F3; border-bottom-right-radius: 4px; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased">

  <div class="flex h-screen overflow-hidden">

    <div id="admin-sidebar-mount"></div>

    <div class="flex-1 flex flex-col overflow-hidden">

      <div class="bg-red-600 text-white text-xs font-semibold tracking-wide uppercase text-center py-1.5 px-4">
        Internal Tool — Portfolio Manager Access Only — Not the Client-Facing Site
      </div>

      <header class="h-16 bg-white border-b border-slate-200 flex items-center justify-between pl-16 pr-8 lg:pl-8 shrink-0">
        <div>
          <p class="text-sm font-medium text-slate-900" id="live-day">Loading...</p>
          <p class="text-xs text-slate-500" id="live-date-time"></p>
        </div>
        <div class="flex items-center gap-4">
          <p class="text-xs text-slate-400" id="realtime-status">Connecting…</p>
          <button type="button" id="new-message-btn" class="px-3 py-1.5 rounded-lg bg-slate-900 text-white text-xs font-medium hover:bg-slate-800 transition">+ New Message</button>
        </div>
      </header>

      <main class="flex-1 overflow-hidden flex">

        <!-- ========== LEFT: conversation list ========== -->
        <div class="w-full max-w-sm border-r border-slate-200 bg-white flex flex-col overflow-hidden shrink-0">
          <div class="p-4 border-b border-slate-100 space-y-3">
            <input type="text" id="inbox-search" placeholder="Search name, email, or message…" class="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/30 focus:border-amber-500">
            <div class="flex flex-wrap gap-1.5 text-xs font-medium" id="status-filters">
              <span class="filter-pill is-active px-2.5 py-1 rounded-full bg-slate-100 text-slate-600" data-status-filter="all">All</span>
              <span class="filter-pill px-2.5 py-1 rounded-full bg-slate-100 text-slate-600" data-status-filter="unread">Unread</span>
              <span class="filter-pill px-2.5 py-1 rounded-full bg-slate-100 text-slate-600" data-status-filter="open">Open</span>
              <span class="filter-pill px-2.5 py-1 rounded-full bg-slate-100 text-slate-600" data-status-filter="resolved">Resolved</span>
              <span class="filter-pill px-2.5 py-1 rounded-full bg-slate-100 text-slate-600" data-status-filter="archived">Archived</span>
            </div>
            <div class="flex flex-wrap gap-1.5 text-xs font-medium" id="channel-filters">
              <span class="filter-pill is-active px-2.5 py-1 rounded-full bg-slate-100 text-slate-600" data-channel-filter="all">All Channels</span>
              <span class="filter-pill px-2.5 py-1 rounded-full bg-slate-100 text-slate-600" data-channel-filter="chat">Chat</span>
              <span class="filter-pill px-2.5 py-1 rounded-full bg-slate-100 text-slate-600" data-channel-filter="email">Email</span>
            </div>
          </div>
          <div class="flex-1 overflow-y-auto" id="convo-list"></div>
        </div>

        <!-- ========== RIGHT: thread ========== -->
        <div class="flex-1 flex flex-col overflow-hidden relative">
          <div class="blob blob--sm blob--teal -z-10" style="top:-80px; right:-60px;" aria-hidden="true"></div>

          <div id="thread-empty-state" class="flex-1 flex items-center justify-center text-slate-400 text-sm">
            Select a conversation to view the thread.
          </div>

          <div id="thread-view" class="flex-1 flex flex-col overflow-hidden hidden">
            <div class="px-6 py-4 border-b border-slate-200 bg-white flex items-center justify-between shrink-0">
              <div class="min-w-0">
                <p class="font-semibold text-slate-900" id="thread-contact-name"></p>
                <p class="text-xs text-slate-500" id="thread-contact-email"></p>
                <p class="text-xs text-slate-400 truncate hidden" id="thread-subject"></p>
              </div>
              <div class="flex items-center gap-2 shrink-0">
                <span class="text-xs font-medium px-2.5 py-1 rounded-full" id="thread-status-badge"></span>
                <button type="button" id="thread-resolve-btn" class="px-3 py-1.5 rounded-lg bg-slate-900 text-white text-xs font-medium hover:bg-slate-800 transition">Resolve</button>
                <button type="button" id="thread-archive-btn" class="px-3 py-1.5 rounded-lg bg-slate-100 text-slate-600 text-xs font-medium hover:bg-slate-200 transition">Archive</button>
                <button type="button" id="thread-reopen-btn" class="px-3 py-1.5 rounded-lg bg-slate-100 text-slate-600 text-xs font-medium hover:bg-slate-200 transition hidden">Reopen</button>
              </div>
            </div>
            <div class="flex-1 overflow-y-auto p-6 space-y-3" id="thread-messages"></div>
            <div class="border-t border-slate-200 bg-white p-4 flex gap-2 shrink-0">
              <input type="text" id="thread-reply-input" placeholder="Reply…" class="flex-1 px-3 py-2 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/30 focus:border-amber-500">
              <button type="button" id="thread-reply-send" class="px-4 py-2 rounded-lg bg-slate-900 text-white text-sm font-medium hover:bg-slate-800 transition">Send</button>
            </div>
          </div>
        </div>

      </main>
    </div>
  </div>

  <!-- ========================================================================================
       PM Compose Email + Company Announcements (2026-09-07). One "New Message" surface,
       inside this same inbox page rather than a separate page — per instruction, mirroring
       the reasoning already given for Part A ("a composed email genuinely IS the start of a
       thread and should appear there afterward... a separate page would create a second
       place PM-to-client email lives") and extended here to Part B: this inbox is where ALL
       outbound PM email intent lives, whether or not the result becomes a conversation. Two
       tabs inside one modal — "To One Client" (a real compose, resolving via
       send-conversation-reply's own new compose mode; the resulting conversation/message
       arrive back into the list automatically via this page's existing Realtime
       subscription, no extra code needed here) and "Company Announcement" (a real bulk send
       via send-announcement — deliberately never touches conversations/messages at all, per
       instruction, so nothing here pushes it into the list either). A real recipient-count
       preview + an explicit two-step confirm gate the bulk send, since it can reach many
       real people at once. ======================================================================================== -->
  <div id="compose-modal-backdrop" class="hidden fixed inset-0 bg-slate-900/50 z-40 flex items-center justify-center p-4">
    <div class="glass bg-white rounded-2xl shadow-xl w-full max-w-lg max-h-[90vh] overflow-y-auto">
      <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between sticky top-0 bg-white/95 backdrop-blur-sm">
        <p class="font-semibold text-slate-900">New Message</p>
        <button type="button" id="compose-modal-close" class="text-slate-400 hover:text-slate-600 text-xl leading-none">&times;</button>
      </div>

      <div class="px-6 pt-4">
        <div class="flex gap-1.5 text-xs font-medium mb-4" id="compose-mode-tabs">
          <span class="filter-pill is-active px-3 py-1.5 rounded-full bg-slate-100 text-slate-600 cursor-pointer" data-compose-mode="single">To One Client</span>
          <span class="filter-pill px-3 py-1.5 rounded-full bg-slate-100 text-slate-600 cursor-pointer" data-compose-mode="announcement">Company Announcement</span>
        </div>
      </div>

      <div class="px-6 pb-6 space-y-4">

        <!-- SINGLE-CLIENT PANEL -->
        <div id="compose-panel-single">
          <label class="block text-xs font-medium text-slate-500 mb-1">Recipient</label>
          <div class="relative">
            <input type="text" id="compose-client-search" placeholder="Search real clients by name or email…" autocomplete="off" class="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/30 focus:border-amber-500">
            <div id="compose-client-results" class="hidden absolute z-10 left-0 right-0 mt-1 bg-white border border-slate-200 rounded-lg shadow-lg max-h-48 overflow-y-auto"></div>
          </div>
          <div id="compose-client-selected" class="hidden mt-2 flex items-center justify-between gap-2 bg-slate-50 rounded-lg px-3 py-2 text-sm">
            <span class="flex-1 truncate" id="compose-client-selected-label"></span>
            <button type="button" id="compose-client-clear" class="text-slate-400 hover:text-slate-600 text-xs font-medium shrink-0">Change</button>
          </div>
        </div>

        <!-- ANNOUNCEMENT PANEL — recipients are always real, registered clients; no manual
             address entry, per instruction. -->
        <div id="compose-panel-announcement" class="hidden space-y-3">
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">Status</label>
            <select id="announce-status-filter" class="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm">
              <option value="active" selected>Active clients only</option>
              <option value="all">All clients (any status, including pending/rejected)</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-500 mb-1">Account Type</label>
            <select id="announce-account-type-filter" class="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm">
              <option value="all" selected>All account types</option>
              <option value="Individual Account">Individual Account</option>
              <option value="Joint Account">Joint Account</option>
              <option value="Business Account">Business Account</option>
            </select>
          </div>
          <p class="text-xs text-slate-500" id="announce-recipient-count">Loading real client list…</p>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">Subject</label>
          <input type="text" id="compose-subject" class="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/30 focus:border-amber-500">
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1">Message</label>
          <textarea id="compose-body" rows="6" class="w-full px-3 py-2 rounded-lg border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500/30 focus:border-amber-500"></textarea>
        </div>
        <div>
          <label class="block text-xs font-medium text-slate-500 mb-1.5">Footer Type — an explicit choice at send time, not a guess</label>
          <div class="flex gap-4 text-sm">
            <label class="flex items-center gap-1.5 cursor-pointer"><input type="radio" name="compose-footer-type" value="general" checked> General</label>
            <label class="flex items-center gap-1.5 cursor-pointer"><input type="radio" name="compose-footer-type" value="investment"> Investment (includes the risk disclosure)</label>
          </div>
        </div>

        <div id="compose-confirm-panel" class="hidden bg-amber-50 border border-amber-200 rounded-lg px-4 py-3 text-sm text-amber-800"></div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" id="compose-cancel-btn" class="px-4 py-2 rounded-lg bg-slate-100 text-slate-600 text-sm font-medium hover:bg-slate-200 transition hidden">Cancel</button>
          <button type="button" id="compose-send-btn" class="px-4 py-2 rounded-lg bg-slate-900 text-white text-sm font-medium hover:bg-slate-800 transition">Send</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="admin-toast" class="hidden fixed bottom-6 right-6 bg-slate-900 text-white rounded-xl shadow-lg px-5 py-4 max-w-sm z-50">
    <p class="font-medium text-sm" id="admin-toast-title">Done</p>
    <p class="text-sm text-white/80 mt-0.5" id="admin-toast-body"></p>
  </div>

  <script src="admin-sidebar.js"></script>
  <script src="dashboard-common.js"></script>
  <script src="engine-core.js"></script>
  <script src="supabase-data.js"></script>
  <script>
    initAdminSidebar('inbox');
  </script>

  <script>
    // Unified Communications Inbox — Stage 1 (2026-09-07). A genuinely live PM inbox: real
    // Supabase Realtime subscriptions on both conversations and messages (no polling), real
    // search across contact name/email/message body, real status actions and unread
    // tracking. All conversations + all messages are held in memory (fetched once via
    // MarketswaveData.selectTable(), which already routes through useAdminClient()'s
    // cross-client-RLS admin session) and kept live by the two Realtime subscriptions below
    // — the same "fetch once, keep live via Realtime, filter/search client-side" shape this
    // project's own Client List already established for its own search/filter, extended here
    // with a genuine live feed on top.
    (function () {
      if (typeof MarketswaveData === 'undefined') return;
      MarketswaveData.useAdminClient();

      var toast = document.getElementById('admin-toast');
      var toastTitle = document.getElementById('admin-toast-title');
      var toastBody = document.getElementById('admin-toast-body');
      var toastTimer;
      function showToast(title, body, isError) {
        toastTitle.textContent = title;
        toastBody.textContent = body;
        toast.classList.toggle('bg-red-700', !!isError);
        toast.classList.toggle('bg-slate-900', !isError);
        toast.classList.remove('hidden');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(function () { toast.classList.add('hidden'); }, 4000);
      }

      function timeAgo(iso) {
        if (!iso) return '';
        var diffMs = Date.now() - new Date(iso).getTime();
        var mins = Math.floor(diffMs / 60000);
        if (mins < 1) return 'just now';
        if (mins < 60) return mins + 'm ago';
        var hours = Math.floor(mins / 60);
        if (hours < 24) return hours + 'h ago';
        var days = Math.floor(hours / 24);
        return days + 'd ago';
      }

      var conversations = []; // in-memory, kept live by Realtime
      var messages = [];      // in-memory, kept live by Realtime
      var conversationsById = {};
      var activeConversationId = null;
      var statusFilter = 'all';
      var channelFilter = 'all';
      var searchTerm = '';

      function reindexConversations() {
        conversationsById = {};
        conversations.forEach(function (c) { conversationsById[c.id] = c; });
      }

      function lastMessageFor(conversationId) {
        var own = messages.filter(function (m) { return m.conversation_id === conversationId; });
        if (!own.length) return null;
        return own.reduce(function (a, b) { return new Date(a.sent_at) > new Date(b.sent_at) ? a : b; });
      }

      function matchesSearch(convo) {
        if (!searchTerm) return true;
        var term = searchTerm.toLowerCase();
        if ((convo.contact_name || '').toLowerCase().indexOf(term) !== -1) return true;
        if ((convo.contact_email || '').toLowerCase().indexOf(term) !== -1) return true;
        var ownMessages = messages.filter(function (m) { return m.conversation_id === convo.id; });
        return ownMessages.some(function (m) { return (m.body || '').toLowerCase().indexOf(term) !== -1; });
      }

      function matchesStatusFilter(convo) {
        if (statusFilter === 'all') return true;
        if (statusFilter === 'unread') return convo.unread_by_pm === true;
        return convo.status === statusFilter;
      }

      function matchesChannelFilter(convo) {
        if (channelFilter === 'all') return true;
        var ownMessages = messages.filter(function (m) { return m.conversation_id === convo.id; });
        return ownMessages.some(function (m) { return m.channel === channelFilter; });
      }

      function renderConvoList() {
        var listEl = document.getElementById('convo-list');
        var filtered = conversations
          .filter(matchesStatusFilter)
          .filter(matchesChannelFilter)
          .filter(matchesSearch)
          .sort(function (a, b) {
            var at = a.last_message_at || a.created_at;
            var bt = b.last_message_at || b.created_at;
            return new Date(bt) - new Date(at);
          });

        if (filtered.length === 0) {
          listEl.innerHTML = '<p class="text-sm text-slate-400 px-6 py-10 text-center">No conversations match.</p>';
          return;
        }

        listEl.innerHTML = filtered.map(function (c) {
          var last = lastMessageFor(c.id);
          var preview = last ? escapeHtml(last.body).slice(0, 64) : 'No messages yet';
          var isActive = c.id === activeConversationId;
          var unreadDot = c.unread_by_pm ? '<span class="w-2 h-2 rounded-full bg-amber-500 inline-block"></span>' : '';
          var statusClass = c.status === 'resolved' ? 'bg-emerald-50 text-emerald-700' : (c.status === 'archived' ? 'bg-slate-100 text-slate-500' : 'bg-blue-50 text-blue-700');
          return '<div class="convo-row cursor-pointer px-4 py-3.5 border-b border-slate-50 ' + (isActive ? 'is-active' : '') + '" data-convo-id="' + c.id + '">' +
            '<div class="flex items-center justify-between gap-2">' +
              '<p class="text-sm font-medium text-slate-900 truncate">' + escapeHtml(c.contact_name || c.contact_email) + '</p>' +
              unreadDot +
            '</div>' +
            '<p class="text-xs text-slate-400 truncate">' + escapeHtml(c.contact_email) + '</p>' +
            '<p class="text-xs text-slate-500 truncate mt-1">' + preview + '</p>' +
            '<div class="flex items-center gap-2 mt-1.5">' +
              '<span class="text-[10px] font-medium px-2 py-0.5 rounded-full ' + statusClass + '">' + c.status + '</span>' +
              '<span class="text-[10px] text-slate-400">' + timeAgo(c.last_message_at || c.created_at) + '</span>' +
            '</div>' +
          '</div>';
        }).join('');

        listEl.querySelectorAll('.convo-row').forEach(function (row) {
          row.addEventListener('click', function () {
            openConversation(row.getAttribute('data-convo-id'));
          });
        });
      }

      function escapeHtml(value) {
        var div = document.createElement('div');
        div.textContent = String(value == null ? '' : value);
        return div.innerHTML;
      }

      function renderThread() {
        var convo = conversationsById[activeConversationId];
        if (!convo) return;
        document.getElementById('thread-empty-state').classList.add('hidden');
        document.getElementById('thread-view').classList.remove('hidden');
        document.getElementById('thread-contact-name').textContent = convo.contact_name || convo.contact_email;
        document.getElementById('thread-contact-email').textContent = convo.contact_email;
        var subjectEl = document.getElementById('thread-subject');
        subjectEl.textContent = convo.subject ? 'Subject: ' + convo.subject : '';
        subjectEl.classList.toggle('hidden', !convo.subject);

        var badge = document.getElementById('thread-status-badge');
        var statusClass = convo.status === 'resolved' ? 'bg-emerald-50 text-emerald-700' : (convo.status === 'archived' ? 'bg-slate-100 text-slate-500' : 'bg-blue-50 text-blue-700');
        badge.className = 'text-xs font-medium px-2.5 py-1 rounded-full ' + statusClass;
        badge.textContent = convo.status;

        document.getElementById('thread-resolve-btn').classList.toggle('hidden', convo.status === 'resolved');
        document.getElementById('thread-archive-btn').classList.toggle('hidden', convo.status === 'archived');
        document.getElementById('thread-reopen-btn').classList.toggle('hidden', convo.status === 'open');

        var ownMessages = messages.filter(function (m) { return m.conversation_id === activeConversationId; }).sort(function (a, b) { return new Date(a.sent_at) - new Date(b.sent_at); });
        var threadEl = document.getElementById('thread-messages');
        threadEl.innerHTML = ownMessages.map(function (m) {
          var channelTag = '<span class="text-[9px] uppercase tracking-wide font-semibold opacity-60">' + (m.channel === 'email' ? 'Email' : 'Chat') + '</span><br>';
          return '<div class="inbox-msg-row is-' + m.direction + '"><div class="inbox-msg-bubble">' + channelTag + escapeHtml(m.body) + '</div></div>';
        }).join('');
        threadEl.scrollTop = threadEl.scrollHeight;
      }

      function openConversation(id) {
        activeConversationId = id;
        renderConvoList();
        renderThread();
        var convo = conversationsById[id];
        if (convo && convo.unread_by_pm) {
          MarketswaveData.callFunction('admin-update-conversation', { conversationId: id, markRead: true }).then(function (updated) {
            convo.unread_by_pm = updated.unread_by_pm;
            renderConvoList();
          }).catch(function () {});
        }
      }

      function updateStatus(status) {
        if (!activeConversationId) return;
        MarketswaveData.callFunction('admin-update-conversation', { conversationId: activeConversationId, status: status }).then(function (updated) {
          var convo = conversationsById[activeConversationId];
          if (convo) {
            convo.status = updated.status;
            convo.resolved_by = updated.resolved_by;
            convo.resolved_by_email = updated.resolved_by_email;
          }
          renderConvoList();
          renderThread();
          showToast('Conversation Updated', 'Marked as ' + status + '.');
        }).catch(function (err) {
          showToast('Update Failed', MarketswaveData.writeErrorMessage(err), true);
        });
      }

      // Unified Communications Inbox — Stage 2 (2026-09-07). Routes through the real
      // send-conversation-reply Edge Function instead of a direct client-side insert — a real
      // email reply needs a real server-side round trip to Resend (to capture the real
      // RFC822 message_id for threading) before the row can even be written, which a
      // client-side insert can't do; the function decides chat-vs-email automatically from
      // the conversation's own most recent message, so the PM never has to choose. The
      // resulting row arrives back into this page's own real-time subscription exactly like
      // any other new message — no local insert/re-render needed here.
      function sendReply() {
        var input = document.getElementById('thread-reply-input');
        var text = input.value.trim();
        if (!text || !activeConversationId) return;
        input.value = '';
        var sendBtn = document.getElementById('thread-reply-send');
        MarketswaveData.withButtonBusy(sendBtn, 'Sending…', function () {
          return MarketswaveData.callFunction('send-conversation-reply', { conversationId: activeConversationId, body: text });
        }).catch(function (err) {
          showToast('Reply Failed', MarketswaveData.writeErrorMessage(err), true);
        });
      }

      document.getElementById('inbox-search').addEventListener('input', function (e) {
        searchTerm = e.target.value.trim();
        renderConvoList();
      });
      document.querySelectorAll('#status-filters .filter-pill').forEach(function (pill) {
        pill.addEventListener('click', function () {
          document.querySelectorAll('#status-filters .filter-pill').forEach(function (p) { p.classList.remove('is-active'); });
          pill.classList.add('is-active');
          statusFilter = pill.getAttribute('data-status-filter');
          renderConvoList();
        });
      });
      document.querySelectorAll('#channel-filters .filter-pill').forEach(function (pill) {
        pill.addEventListener('click', function () {
          document.querySelectorAll('#channel-filters .filter-pill').forEach(function (p) { p.classList.remove('is-active'); });
          pill.classList.add('is-active');
          channelFilter = pill.getAttribute('data-channel-filter');
          renderConvoList();
        });
      });
      document.getElementById('thread-resolve-btn').addEventListener('click', function () { updateStatus('resolved'); });
      document.getElementById('thread-archive-btn').addEventListener('click', function () { updateStatus('archived'); });
      document.getElementById('thread-reopen-btn').addEventListener('click', function () { updateStatus('open'); });
      document.getElementById('thread-reply-send').addEventListener('click', sendReply);
      document.getElementById('thread-reply-input').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') sendReply();
      });

      function loadAndSubscribe() {
        Promise.all([
          MarketswaveData.selectTable('conversations'),
          MarketswaveData.selectTable('messages')
        ]).then(function (results) {
          conversations = results[0];
          messages = results[1];
          reindexConversations();
          renderConvoList();

          return MarketswaveData.getSupabaseClient();
        }).then(function (client) {
          var statusEl = document.getElementById('realtime-status');
          client
            .channel('admin-inbox-live')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, function (payload) {
              messages.push(payload.new);
              renderConvoList();
              if (payload.new.conversation_id === activeConversationId) renderThread();
            })
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'conversations' }, function (payload) {
              conversations.push(payload.new);
              reindexConversations();
              renderConvoList();
            })
            .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'conversations' }, function (payload) {
              var idx = conversations.findIndex(function (c) { return c.id === payload.new.id; });
              if (idx !== -1) conversations[idx] = payload.new;
              reindexConversations();
              renderConvoList();
              if (payload.new.id === activeConversationId) renderThread();
            })
            .subscribe(function (status) {
              statusEl.textContent = status === 'SUBSCRIBED' ? 'Live' : status;
            });
        }).catch(function (err) {
          showToast('Could Not Load Inbox', MarketswaveData.writeErrorMessage(err), true);
        });
      }

      loadAndSubscribe();

      // =======================================================================================
      // PM Compose Email + Company Announcements (2026-09-07). Reuses this same IIFE's real
      // Supabase session (MarketswaveData.useAdminClient(), already called above) — no second
      // client instance. The composed conversation/message (single-client mode) needs no
      // manual local-array push/re-render here at all: it lands via the exact same Realtime
      // subscription already wired in loadAndSubscribe() above, since RLS already allows this
      // admin session to read every real conversation/message. Announcement mode deliberately
      // never touches conversations/messages, so nothing here does either.
      var realClients = [];
      var realClientsLoadedPromise = null;
      var composeMode = 'single';
      var selectedClient = null;
      var announcementConfirming = false;

      function loadRealClients() {
        if (!realClientsLoadedPromise) {
          realClientsLoadedPromise = MarketswaveData.selectTable('clients').then(function (rows) {
            realClients = rows || [];
            updateAnnouncementCount();
            return realClients;
          }).catch(function (err) {
            document.getElementById('announce-recipient-count').textContent = 'Could not load the real client list.';
            throw err;
          });
        }
        return realClientsLoadedPromise;
      }

      function matchesAnnouncementFilter(client) {
        var statusFilter = document.getElementById('announce-status-filter').value;
        var accountTypeFilter = document.getElementById('announce-account-type-filter').value;
        if (statusFilter !== 'all' && client.status !== statusFilter) return false;
        if (accountTypeFilter !== 'all' && client.account_type !== accountTypeFilter) return false;
        return !!(client.email && client.email.trim());
      }

      function updateAnnouncementCount() {
        var el = document.getElementById('announce-recipient-count');
        if (!realClients.length && realClientsLoadedPromise) { el.textContent = 'Loading real client list…'; return; }
        var matching = realClients.filter(matchesAnnouncementFilter);
        el.textContent = matching.length === 0
          ? 'No real clients match this filter — nothing would be sent.'
          : matching.length + ' real client' + (matching.length === 1 ? '' : 's') + ' will receive this announcement.';
        resetAnnouncementConfirm();
      }

      function resetAnnouncementConfirm() {
        announcementConfirming = false;
        document.getElementById('compose-confirm-panel').classList.add('hidden');
        document.getElementById('compose-cancel-btn').classList.add('hidden');
        document.getElementById('compose-send-btn').textContent = 'Send';
      }

      function renderClientResults(query) {
        var resultsEl = document.getElementById('compose-client-results');
        var term = query.trim().toLowerCase();
        if (!term) { resultsEl.classList.add('hidden'); resultsEl.innerHTML = ''; return; }
        var matches = realClients.filter(function (c) {
          return (c.name || '').toLowerCase().indexOf(term) !== -1 || (c.email || '').toLowerCase().indexOf(term) !== -1;
        }).slice(0, 20);
        if (!matches.length) {
          resultsEl.innerHTML = '<p class="px-3 py-2.5 text-sm text-slate-400">No matching real clients.</p>';
        } else {
          resultsEl.innerHTML = matches.map(function (c) {
            return '<div class="compose-client-option px-3 py-2.5 text-sm hover:bg-slate-50 cursor-pointer border-b border-slate-50 last:border-b-0" data-client-id="' + c.id + '">' +
              '<p class="font-medium text-slate-900 truncate">' + escapeHtml(c.name) + '</p>' +
              '<p class="text-xs text-slate-400 truncate">' + escapeHtml(c.email) + '</p>' +
            '</div>';
          }).join('');
          resultsEl.querySelectorAll('.compose-client-option').forEach(function (row) {
            row.addEventListener('click', function () {
              var client = realClients.filter(function (c) { return c.id === row.getAttribute('data-client-id'); })[0];
              if (client) selectClient(client);
            });
          });
        }
        resultsEl.classList.remove('hidden');
      }

      function selectClient(client) {
        selectedClient = client;
        document.getElementById('compose-client-search').value = '';
        document.getElementById('compose-client-results').classList.add('hidden');
        document.getElementById('compose-client-results').innerHTML = '';
        document.getElementById('compose-client-search').classList.add('hidden');
        var chip = document.getElementById('compose-client-selected');
        chip.classList.remove('hidden');
        document.getElementById('compose-client-selected-label').textContent = client.name + ' — ' + client.email;
      }

      function clearSelectedClient() {
        selectedClient = null;
        document.getElementById('compose-client-selected').classList.add('hidden');
        document.getElementById('compose-client-search').classList.remove('hidden');
        document.getElementById('compose-client-search').focus();
      }

      function setComposeMode(mode) {
        composeMode = mode;
        document.querySelectorAll('#compose-mode-tabs .filter-pill').forEach(function (p) { p.classList.toggle('is-active', p.getAttribute('data-compose-mode') === mode); });
        document.getElementById('compose-panel-single').classList.toggle('hidden', mode !== 'single');
        document.getElementById('compose-panel-announcement').classList.toggle('hidden', mode !== 'announcement');
        resetAnnouncementConfirm();
        if (mode === 'announcement') updateAnnouncementCount();
      }

      function resetComposeForm() {
        document.getElementById('compose-subject').value = '';
        document.getElementById('compose-body').value = '';
        document.querySelector('input[name="compose-footer-type"][value="general"]').checked = true;
        clearSelectedClient();
        setComposeMode('single');
      }

      function openComposeModal() {
        document.getElementById('compose-modal-backdrop').classList.remove('hidden');
        loadRealClients();
      }

      function closeComposeModal() {
        document.getElementById('compose-modal-backdrop').classList.add('hidden');
        resetComposeForm();
      }

      function getFooterType() {
        var checked = document.querySelector('input[name="compose-footer-type"]:checked');
        return checked ? checked.value : 'general';
      }

      function handleComposeSend() {
        var subject = document.getElementById('compose-subject').value.trim();
        var body = document.getElementById('compose-body').value.trim();
        var footerType = getFooterType();

        if (composeMode === 'single') {
          if (!selectedClient) { showToast('A Recipient Is Required', 'Search for and select a real client first.', true); return; }
          if (!subject) { showToast('A Subject Is Required', 'Enter a subject for this message.', true); return; }
          if (!body) { showToast('A Message Is Required', 'Enter a message to send.', true); return; }
          var sendBtn = document.getElementById('compose-send-btn');
          MarketswaveData.withButtonBusy(sendBtn, 'Sending…', function () {
            return MarketswaveData.callFunction('send-conversation-reply', { clientId: selectedClient.id, subject: subject, body: body, footerType: footerType });
          }).then(function () {
            showToast('Message Sent', 'Your email to ' + selectedClient.name + ' was sent — it now appears in the inbox as a real conversation.');
            closeComposeModal();
          }).catch(function (err) {
            showToast('Send Failed', MarketswaveData.writeErrorMessage(err), true);
          });
          return;
        }

        // composeMode === 'announcement'
        if (!subject) { showToast('A Subject Is Required', 'Enter a subject for this announcement.', true); return; }
        if (!body) { showToast('A Message Is Required', 'Enter a message to send.', true); return; }
        var matching = realClients.filter(matchesAnnouncementFilter);
        if (matching.length === 0) { showToast('No Recipients', 'No real clients match this filter — nothing to send.', true); return; }

        if (!announcementConfirming) {
          // Two-step confirm — a real bulk send reaching many real people, deliberately not
          // one click away, mirroring this project's own established custom-confirm pattern
          // for any broad or hard-to-reverse action.
          announcementConfirming = true;
          var confirmPanel = document.getElementById('compose-confirm-panel');
          confirmPanel.textContent = 'This will send a real email to ' + matching.length + ' real client' + (matching.length === 1 ? '' : 's') + '. This cannot be undone. Click "Confirm & Send" to proceed.';
          confirmPanel.classList.remove('hidden');
          document.getElementById('compose-cancel-btn').classList.remove('hidden');
          document.getElementById('compose-send-btn').textContent = 'Confirm & Send';
          return;
        }

        var announceBtn = document.getElementById('compose-send-btn');
        MarketswaveData.withButtonBusy(announceBtn, 'Sending…', function () {
          return MarketswaveData.callFunction('send-announcement', {
            subject: subject, body: body, footerType: footerType,
            recipientFilter: {
              status: document.getElementById('announce-status-filter').value,
              accountType: document.getElementById('announce-account-type-filter').value
            }
          });
        }).then(function (result) {
          var summary = result.sentCount + ' of ' + result.totalRecipients + ' delivered' + (result.failedCount ? ', ' + result.failedCount + ' failed' : '') + '.';
          showToast('Announcement Sent', summary);
          closeComposeModal();
        }).catch(function (err) {
          announcementConfirming = false;
          showToast('Send Failed', MarketswaveData.writeErrorMessage(err), true);
        });
      }

      document.getElementById('new-message-btn').addEventListener('click', openComposeModal);
      document.getElementById('compose-modal-close').addEventListener('click', closeComposeModal);
      document.getElementById('compose-modal-backdrop').addEventListener('click', function (e) {
        if (e.target === this) closeComposeModal();
      });
      document.querySelectorAll('#compose-mode-tabs .filter-pill').forEach(function (pill) {
        pill.addEventListener('click', function () { setComposeMode(pill.getAttribute('data-compose-mode')); });
      });
      document.getElementById('compose-client-search').addEventListener('input', function (e) {
        renderClientResults(e.target.value);
      });
      document.getElementById('compose-client-clear').addEventListener('click', clearSelectedClient);
      document.getElementById('announce-status-filter').addEventListener('change', updateAnnouncementCount);
      document.getElementById('announce-account-type-filter').addEventListener('change', updateAnnouncementCount);
      document.getElementById('compose-send-btn').addEventListener('click', handleComposeSend);
      document.getElementById('compose-cancel-btn').addEventListener('click', function () {
        resetAnnouncementConfirm();
      });
    })();
  </script>

</body>
</html>
